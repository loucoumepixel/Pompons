# Fabrique les applis Android dans le cloud de GitHub (rien à installer sur le téléphone).
# Lancement : onglet Actions > "Construire les applis Android" > Run workflow, ou à chaque envoi sur main.
# Résultat : en bas de la page du run, section "Artifacts" :
#   <jeu>-apk : à installer sur le téléphone pour tester
#   <jeu>-aab : le fichier à déposer sur la Play Console (si la clé de signature est configurée)
name: Construire les applis Android
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jeu: [sucrepastel]
    defaults:
      run:
        working-directory: ${{ matrix.jeu }}
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est déjà installé sur les machines GitHub : on accepte juste ses licences.
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android, les icônes et l'écran de démarrage
        run: npm run android

      - name: Écran bloqué en portrait
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Numéro de version (augmente à chaque construction)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: APK de test
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/pompons.keystore"

      - name: Paquet AAB signé pour le Play Store
        if: env.KEYSTORE_BASE64 != ''
        run: |
          MDP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$MDP"
          if ! keytool -list -keystore "$RUNNER_TEMP/pompons.keystore" -storepass "$MDP" -alias pompons > /dev/null 2>&1; then
            echo "::error::Le secret KEYSTORE_PASSWORD ne correspond pas a la cle (longueur recue : ${#MDP} caracteres, attendue : 24)."
            exit 1
          fi
          cd android && ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/pompons.keystore" \
            -Pandroid.injected.signing.store.password="$MDP" \
            -Pandroid.injected.signing.key.alias=pompons \
            -Pandroid.injected.signing.key.password="$MDP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jeu }}-apk
          path: ${{ matrix.jeu }}/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: ${{ matrix.jeu }}-aab
          path: ${{ matrix.jeu }}/android/app/build/outputs/bundle/release/*.aab
