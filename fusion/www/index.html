/* Plein écran portrait : le bocal sur un canvas, les écrans DOM par-dessus. */
:root{
  --nuit:#2a1250; --sucre:#ffd23f; --menthe:#3ee0b4; --rose:#ff4f9a; --encre:#24123f; --creme:#fff6e8;
  --f-titre:"Lilita One","Baloo 2",system-ui,sans-serif; --f-texte:"Baloo 2",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:radial-gradient(60% 40% at 15% 20%,#ffffff0d 0 30%,transparent 31%),radial-gradient(40% 25% at 85% 70%,#ffffff0a 0 30%,transparent 31%),linear-gradient(#3a1a6e,#1d0c3a) fixed;background-color:var(--nuit);color:var(--creme);overflow:hidden;
  font-family:var(--f-texte);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#jeu{position:fixed;inset:0;width:100%;height:100%;display:block}
.ecran{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(16px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) 16px calc(16px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));box-sizing:border-box}
.ecran[hidden]{display:none!important}
#accueil{background:linear-gradient(#2a1250ee 0%,#2a1250aa 45%,#2a125000 75%);justify-content:flex-start;padding-top:calc(48px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)))}
.logo{font-family:var(--f-titre);font-weight:400;font-size:clamp(52px,15vw,96px);line-height:.88;text-align:center;margin:0;
  color:var(--sucre);text-shadow:0 4px 0 #c2541b,0 8px 0 var(--encre),0 10px 24px #0008;transform:rotate(-3deg)}
.logo small{display:block;font-size:.55em;color:var(--menthe);text-shadow:0 3px 0 #13906f,0 6px 0 var(--encre)}
.sous{margin:0;text-align:center;max-width:30ch;font-size:17px;text-shadow:0 2px 6px #000}
.btn{font-family:var(--f-titre);font-size:22px;border:0;border-radius:18px;padding:12px 24px;cursor:pointer;color:var(--encre);
  background:var(--sucre);box-shadow:0 5px 0 #b77d00;min-width:56px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b77d00}
.btn:focus-visible{outline:3px solid var(--creme);outline-offset:3px}
.btn.vert{background:var(--menthe);box-shadow:0 5px 0 #13906f}
.btn.gris{background:#d9cdf0;box-shadow:0 5px 0 #8b7bb0}
.btn.petit{font-size:17px;padding:10px 14px}
.btn.gros{font-size:30px;padding:16px 48px}
.panneau{background:linear-gradient(#5a2a9a,#3a1670);border-radius:26px;padding:22px 20px;width:min(100%,380px);box-sizing:border-box;
  box-shadow:0 8px 0 #1a0838,0 20px 40px #000a;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;border:3px solid #ffffff22}
.panneau h2{font-family:var(--f-titre);font-weight:400;font-size:38px;margin:0;color:var(--sucre);text-shadow:0 3px 0 var(--encre)}
.score-final{font-family:var(--f-titre);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.panneau p{margin:0;font-size:17px}
.rang{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#pause,#fin{background:#12062acc}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(10px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) 12px 0;pointer-events:none}
#hud[hidden]{display:none!important}
#hud .btn{pointer-events:auto;font-size:18px;padding:8px 12px;min-width:44px}
.scores{text-align:center;font-family:var(--f-titre);line-height:1}
#h-score{font-size:40px;color:#fff;text-shadow:0 3px 0 var(--encre);font-variant-numeric:tabular-nums}
#h-record{font-size:15px;color:var(--sucre);margin-top:2px}
.suivant{display:flex;flex-direction:column;align-items:center;font-family:var(--f-titre);font-size:12px;color:#d9cdf0;letter-spacing:.06em}
#h-suivant{width:56px;height:56px;background:#ffffff14;border-radius:50%}
</style></head>
<body>
<canvas id="jeu"></canvas>

<section id="accueil" class="ecran">
  <h1 class="logo">Pompons<small>Fusion</small></h1>
  <p class="sous" id="a-record">Fais fusionner les Pompons jusqu'au Roi Pompon !</p>
  <button class="btn vert gros" type="button" id="b-jouer">Jouer</button>
  <p class="sous" style="font-size:14px;opacity:.85">Glisse le doigt pour viser, lève-le pour lâcher. Deux Pompons pareils qui se touchent fusionnent.</p>
</section>

<div id="hud" hidden>
  <button class="btn gris" type="button" id="b-pause" aria-label="Pause">❚❚</button>
  <div class="scores"><div id="h-score">0</div><div id="h-record">Record 0</div></div>
  <div class="suivant"><canvas id="h-suivant"></canvas>SUIVANT</div>
</div>

<section id="pause" class="ecran" hidden>
  <div class="panneau">
    <h2>Pause</h2>
    <button class="btn vert" type="button" id="p-reprendre">Reprendre</button>
    <div class="rang">
      <button class="btn" type="button" id="p-rejouer">Recommencer</button>
      <button class="btn gris" type="button" id="p-menu">Accueil</button>
    </div>
    <div class="rang">
      <button class="btn gris petit" type="button" id="p-son">Son : oui</button>
      <button class="btn gris petit" type="button" id="p-musique">Musique : oui</button>
    </div>
    <button class="btn gris petit" type="button" id="p-vibre">Vibrations : oui</button>
  </div>
</section>

<section id="fin" class="ecran" hidden>
  <div class="panneau">
    <h2>Le bocal déborde !</h2>
    <canvas id="fin-pompon" width="110" height="110" style="width:110px;height:110px"></canvas>
    <div class="score-final" id="fin-score">0</div>
    <p id="fin-record"></p>
    <p id="fin-tier" style="opacity:.85"></p>
    <div class="rang">
      <button class="btn vert" type="button" id="f-rejouer">Rejouer</button>
      <button class="btn gris" type="button" id="f-menu">Accueil</button>
    </div>
  </div>
</section>

<script>
'use strict';
// ===== Pompons Fusion : outils communs (son, sauvegarde, dessin d'un Pompon) =====
const Sauve = {
  lire(k, def) { try { const v = localStorage.getItem('pompons-fusion.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  ecrire(k, v) { try { localStorage.setItem('pompons-fusion.' + k, JSON.stringify(v)); } catch (e) { } }
};
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ----- Son synthétisé -----
const Son = {
  ac: null, actif: Sauve.lire('son', true), maitre: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.maitre = this.ac.createGain(); this.maitre.gain.value = 0.5; this.maitre.connect(this.ac.destination);
      const n = this.ac.sampleRate; this.bruitBuf = this.ac.createBuffer(1, n, n);
      const d = this.bruitBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  ok() { return this.ac && this.actif; },
  ton(f, dur, type = 'sine', vol = 0.3, f2 = null, delai = 0) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + delai, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.maitre); o.start(t); o.stop(t + dur + 0.05);
  },
  bruit(dur, vol = 0.3, freq = 1200, q = 1, type = 'bandpass', delai = 0, f2 = null) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + delai, s = this.ac.createBufferSource(), fl = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.bruitBuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.maitre); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  pop(t) { const f = 900 * Math.pow(0.86, t); this.ton(f, 0.16, 'triangle', 0.2, f * 1.6); this.ton(f * 2, 0.08, 'sine', 0.06, null, 0.02); this.bruit(0.07, 0.12, 3000, 2); },
  chute() { this.ton(420, 0.1, 'sine', 0.08, 260); },
  pose(v) { this.bruit(0.06, 0.08 * v, 400, 1.5); },
  alerte() { this.ton(880, 0.12, 'square', 0.05); },
  geant() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.ton(f, 0.35, 'triangle', 0.16, null, i * 0.08)); this.bruit(0.8, 0.3, 2000, 0.6, 'bandpass', 0, 6000); },
  fin() { [392, 330, 262, 196].forEach((f, i) => this.ton(f, 0.4, 'triangle', 0.15, null, i * 0.2)); },
  clic() { this.ton(660, 0.06, 'sine', 0.1); }
};

function dessinerPompon(c, x, y, r, opts = {}) {
  const expr = opts.expr || 'calme';
  c.save(); c.translate(x, y); if (opts.angle) c.rotate(opts.angle);
  const s = r / 50; c.scale(s, s);
  const corps = opts.couleur || (opts.chapeau === 'toque' ? '#ffb83d' : '#ff8a3d'), contour = '#2b1530';
  c.lineJoin = 'round'; c.lineCap = 'round';
  // fourrure : bord festonné
  const poils = () => { c.beginPath(); const n = 26; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, a2 = (i + 0.5) / n * Math.PI * 2; const r1 = 47, r2 = 54; if (i === 0) c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); else c.quadraticCurveTo(Math.cos(a - Math.PI / n) * r2, Math.sin(a - Math.PI / n) * r2, Math.cos(a) * r1, Math.sin(a) * r1); } c.closePath(); };
  poils(); c.fillStyle = corps; c.fill();
  const g = c.createRadialGradient(-18, -22, 4, 0, 0, 56);
  g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(.4, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(40,0,40,.32)');
  c.fillStyle = g; c.fill(); c.strokeStyle = contour; c.lineWidth = 4; c.stroke();
  // mèches sur le dessus
  if (opts.chapeau !== 'toque') {
    c.fillStyle = corps; c.lineWidth = 3.5;
    c.beginPath(); c.moveTo(-12, -46); c.quadraticCurveTo(-16, -68, -2, -66); c.quadraticCurveTo(-4, -58, 4, -56); c.quadraticCurveTo(8, -72, 20, -64); c.quadraticCurveTo(12, -56, 14, -46); c.closePath(); c.fill(); c.stroke();
  }
  // bandeau de ninja (version lancée)
  if (opts.chapeau === 'casque') {
    c.save(); poils(); c.clip();
    c.fillStyle = opts.bande || '#fff3d6'; c.fillRect(-60, -34, 120, 13);
    c.strokeStyle = contour; c.lineWidth = 3; c.beginPath(); c.moveTo(-60, -34); c.lineTo(60, -34); c.moveTo(-60, -21); c.lineTo(60, -21); c.stroke();
    c.restore();
    c.fillStyle = opts.bande || '#fff3d6'; c.strokeStyle = contour; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-46, -30); c.quadraticCurveTo(-66, -40, -76, -24); c.quadraticCurveTo(-64, -28, -48, -22); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-46, -27); c.quadraticCurveTo(-70, -18, -72, -2); c.quadraticCurveTo(-60, -14, -48, -20); c.closePath(); c.fill(); c.stroke();
  }
  // joues
  c.fillStyle = 'rgba(255,90,130,.45)'; [-1, 1].forEach(k => { c.beginPath(); c.ellipse(k * 30, 18, 9, 6, 0, 0, Math.PI * 2); c.fill(); });
  // grands yeux
  const regard = opts.regard || 0, rx = Math.cos(regard) * 4, ry = Math.sin(regard) * 4;
  [-1, 1].forEach(k => {
    const ex = k * 16, ey = -4;
    if (expr === 'joie' || (expr === 'clin' && k === 1)) { c.strokeStyle = contour; c.lineWidth = 5; c.beginPath(); c.arc(ex, ey + 4, 9, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); return; }
    if (expr === 'aie') { c.strokeStyle = contour; c.lineWidth = 4.5; c.beginPath(); c.moveTo(ex - 7, ey - 7); c.lineTo(ex + 7, ey + 7); c.moveTo(ex + 7, ey - 7); c.lineTo(ex - 7, ey + 7); c.stroke(); return; }
    c.fillStyle = '#fff'; c.strokeStyle = contour; c.lineWidth = 3.5;
    c.beginPath(); c.ellipse(ex, ey, 12, 15, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    const pr = expr === 'cri' ? 4 : 7;
    c.fillStyle = '#1b1320'; c.beginPath(); c.arc(ex + rx, ey + ry + 2, pr, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + rx - 2.5, ey + ry - 1, pr * 0.35, 0, Math.PI * 2); c.fill();
  });
  // sourcils froncés quand il crie
  if (expr === 'cri') { c.strokeStyle = contour; c.lineWidth = 4.5; c.beginPath(); c.moveTo(-26, -24); c.lineTo(-8, -18); c.moveTo(26, -24); c.lineTo(8, -18); c.stroke(); }
  // bouche
  c.strokeStyle = contour; c.lineWidth = 3.5;

const Musique = {

  MELODIE: [12, null, 14, 16, null, 19, 16, null, 14, null, 12, 9, null, 12, null, null],

  arreter() { if (this.minuteur) { clearInterval(this.minuteur); this.minuteur = null; } },

const cv = document.getElementById('jeu'), ctx = cv.getContext('2d');

// Les 11 Pompons, du plus petit au géant. r en unités du bocal (400 de large).

  { nom: 'Ballon', r: 80, coul: '#a65cff' },
  { nom: 'Lune', r: 93, coul: '#e45cd8' },
  { nom: 'Planète', r: 108, coul: '#ff4f6a' },
  { nom: 'Roi Pompon', r: 124, coul: '#ffd23f' }

const POINTS = TIERS.map((_, i) => (i + 1) * (i + 2) / 2);

function redim() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

  const cs = getComputedStyle(sonde); MH = parseFloat(cs.paddingTop) || 0; MB = parseFloat(cs.paddingBottom) || 0;
  const haut = 104 + MH, bas = 74 + MB;
  ech = Math.min((W - 28) / (BW + 24), (H - haut - bas) / (BH + 16));

window.addEventListener('resize', redim);

function tirage() { return Math.floor(Math.random() * Math.min(5, 3 + Math.floor(meilleurTierPartie / 2))); }

function nouvellePartie() {
  moteur = Engine.create({ gravity: { y: 1.25 } });
  moteur.positionIterations = 10; moteur.velocityIterations = 8;
  const st = { isStatic: true, friction: 0.4, restitution: 0.1 };
  Composite.add(moteur.world, [
    Bodies.rectangle(BW / 2, BH + EP / 2, BW + EP * 2, EP, st),
    Bodies.rectangle(-EP / 2, BH / 2 - 300, EP, BH + 600, st),

  Events.on(moteur, 'collisionActive', contacts);

  actuel = Math.floor(Math.random() * 3); suivant = Math.floor(Math.random() * 3);
  etat = 'jeu'; enPause = false; majHud();
}

function creer(t, x, y, vy = 0) {
  const T = TIERS[t];
  const b = Bodies.circle(x, y, T.r, { restitution: 0.15, friction: 0.12, frictionStatic: 0.4, density: 0.0012, slop: 0.02 });
  b.pom = { t, age: 0, joie: 0, fusionne: false, regard: rnd(0, 6.28), naissance: 0 };
  Body.setVelocity(b, { x: 0, y: vy });
  Composite.add(moteur.world, b); corps.push(b);

}

function contacts(ev) {
  if (etat !== 'jeu') return;
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (!a.pom || !b.pom || a.pom.fusionne || b.pom.fusionne || a.pom.t !== b.pom.t) continue;
    a.pom.fusionne = b.pom.fusionne = true;

  }
}

function fusionner(a, b) {
  const t = a.pom.t, x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
  Composite.remove(moteur.world, a); Composite.remove(moteur.world, b);

  eclats(x, y, TIERS[t].coul, 10 + t * 3, TIERS[t].r);
  if (t + 1 < TIERS.length) {
    const n = creer(t + 1, x, y, -1.5); n.pom.joie = 1.2; n.pom.age = 1; n.pom.naissance = 1;

  } else {

    eclats(x, y, '#ffd23f', 80, 140);

  }

function eclats(x, y, coul, n, r) {

function lacher() {

}

function maj(dt) {
  temps += dt;
  if (etat === 'demo') { acc += dt; while (acc >= PAS) { Engine.update(moteur, PAS * 1000); acc -= PAS; } return; }
  if (etat === 'fin' && tFin > 0) { tFin -= dt; if (tFin <= 0) montrer('fin'); }
  if (etat !== 'jeu' || enPause) return;
  attente = Math.max(0, attente - dt); tCombo -= dt;
  if (attente === 0 && lacherDemande) lacher();
  // pas fixes pour une physique stable
  acc += dt; while (acc >= PAS) { Engine.update(moteur, PAS * 1000); acc -= PAS;
    while (aFusionner.length) { const [a, b] = aFusionner.shift(); fusionner(a, b); } }
  // filet de sécurité : un Pompon éjecté hors du bocal disparaît
  for (const c of corps) if (c.position.y > BH + 300 || c.position.x < -200 || c.position.x > BW + 200) { Composite.remove(moteur.world, c); c.pom.dehors = true; }
  if (corps.some(c => c.pom.dehors)) corps = corps.filter(c => !c.pom.dehors);
  // danger : un Pompon posé dépasse la ligne
  let auDessus = false;

    const vit = Math.hypot(c.velocity.x, c.velocity.y);

  }

}

    const r = TIERS[actuel].r, vx = clamp(viseX, r + 1, BW - r - 1);
    c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 2; c.setLineDash([4, 10]);
    c.beginPath(); c.moveTo(X(vx), Y(LACHER + r)); c.lineTo(X(vx), Y(BH)); c.stroke(); c.setLineDash([]);
    c.globalAlpha = attente > 0 ? 0.45 : 1;
    pompon(c, actuel, X(vx), Y(LACHER), Math.sin(temps * 2) * 0.08, 'calme', Math.PI / 2);
    c.globalAlpha = 1;
  }
  const peur = danger > 0.4;
  for (const b of corps) {
    const p = b.pom, expr = p.joie > 0 ? 'joie' : (peur && b.position.y < LIGNE + 160 ? 'cri' : (p.t % 4 === 3 ? 'clin' : 'calme'));
    const exprF = expr === 'clin' && Math.sin(temps * 0.7 + p.regard * 3) < 0.9 ? 'calme' : expr;
    pompon(c, p.t, X(b.position.x), Y(b.position.y), b.angle, exprF, p.regard + Math.sin(temps + p.regard) * 0.6, ech, p.naissance);
  }
  poser(c, couches.verre);
  for (const p of parts) {
    c.globalAlpha = 1 - p.vie / p.v; c.fillStyle = p.coul;
    c.beginPath(); c.arc(X(p.x), Y(p.y), p.t * ech + 1, 0, 6.283); c.fill();
  }
  c.globalAlpha = 1;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const p of popups) {
    const a = Math.min(1, (p.v - p.vie) * 3), sz = p.taille * Math.min(1, 0.6 + p.vie * 4);
    c.globalAlpha = a; c.font = `${sz}px 'Lilita One'`;
    c.lineWidth = 6; c.strokeStyle = '#2b1530'; c.strokeText(p.txt, X(p.x), Y(p.y)); c.fillStyle = p.coul; c.fillText(p.txt, X(p.x), Y(p.y));
  }
  c.globalAlpha = 1;
  c.restore();
  // astuce tant que le joueur n'a rien lâché
  if (etat === 'jeu' && nbLachers === 0 && !enPause) {
    const a = 0.75 + 0.25 * Math.sin(temps * 4), mx = W / 2 + Math.sin(temps * 1.6) * BW * ech * 0.25, my = oy + BH * ech * 0.42;
    c.globalAlpha = a; c.font = `30px 'Lilita One'`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('👆', mx, my); c.font = `20px 'Lilita One'`; c.fillStyle = '#fff'; c.lineWidth = 5; c.strokeStyle = '#2b1530'; c.lineJoin = 'round';
    c.strokeText('Glisse pour viser, lève le doigt pour lâcher', W / 2, my + 44); c.fillText('Glisse pour viser, lève le doigt pour lâcher', W / 2, my + 44);
    c.globalAlpha = 1;
  }
  // alerte
  if (danger > 0.3 && etat === 'jeu') {
    c.font = `${22}px 'Lilita One'`; c.fillStyle = '#ff5d7a'; c.globalAlpha = 0.6 + 0.4 * Math.sin(temps * 14);
    c.fillText('Attention, ça déborde !', W / 2, oy + LIGNE * ech - 22); c.globalAlpha = 1;
  }
  frise(c);
}

// frise des évolutions en bas de l'écran
let cacheFrise = null;
function frise(c) {
  const cle = W + 'x' + H + ':' + meilleurTier + ':' + DPR + ':' + MB;
  if (!cacheFrise || cacheFrise.cle !== cle) {
    const cv2 = document.createElement('canvas'); cv2.width = Math.round(W * DPR); cv2.height = Math.round((80 + MB) * DPR);
    const c2 = cv2.getContext('2d'); c2.setTransform(DPR, 0, 0, DPR, 0, -(H - 80 - MB) * DPR);
    friseDessin(c2); cacheFrise = { cle, cv: cv2 };
  }
  c.drawImage(cacheFrise.cv, 0, H - 80 - MB, W, 80 + MB);
}
function friseDessin(c) {
  const n = TIERS.length, larg = Math.min(W - 24, 520), pas = larg / n, y = H - 36 - MB, x0 = (W - larg) / 2 + pas / 2;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.roundRect((W - larg) / 2 - 6, y - pas / 2 - 4, larg + 12, pas + 8, 14); c.fill();
  for (let i = 0; i < n; i++) {
    const connu = i <= Math.max(meilleurTier, 4);
    c.globalAlpha = connu ? 1 : 0.35;
    const rr = pas * (0.26 + 0.2 * i / (n - 1));
    if (connu) dessinerPompon(c, x0 + i * pas, y, rr, { couleur: TIERS[i].coul, expr: 'calme' });
    else { c.fillStyle = '#fff'; c.font = `${pas * 0.5}px 'Lilita One'`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', x0 + i * pas, y); }
  }
  c.globalAlpha = 1;
}

function majHud() {
  if (score === 0) { scoreAffiche = 0; $('h-score').textContent = 0; }
  $('h-record').textContent = 'Record ' + Math.max(record, score);
  const cs = $('h-suivant'), c = cs.getContext('2d'), d = Math.min(2.5, window.devicePixelRatio || 1);
  cs.width = 56 * d; cs.height = 56 * d; c.setTransform(d, 0, 0, d, 0, 0);
  const T = TIERS[suivant]; dessinerPompon(c, 28, 33, 7 + T.r * 0.3, { couleur: T.coul, expr: 'calme' });
}

// petit bocal décoratif derrière l'accueil
function demo() { nouvellePartie(); etat = 'demo'; for (let i = 0; i < 10; i++) creer(Math.floor(rnd(0, 7)), rnd(70, 330), rnd(260, 560)); }

// ----- Écrans -----
function montrer(id) { ['accueil', 'pause', 'fin'].forEach(e => $(e).hidden = e !== id); }
function jouer() { Son.init(); Son.clic(); montrer(null); $('hud').hidden = false; nouvellePartie(); Musique.lancer(); }
$('b-jouer').onclick = jouer;
$('f-rejouer').onclick = jouer;
$('f-menu').onclick = () => { Son.clic(); afficherAccueil(); };
function majReglages() {
  $('p-son').textContent = 'Son : ' + (Son.actif ? 'oui' : 'non');
  $('p-musique').textContent = 'Musique : ' + (Musique.actif ? 'oui' : 'non');
  $('p-vibre').textContent = 'Vibrations : ' + (Vibre.actif ? 'oui' : 'non');
}
$('b-pause').onclick = () => { if (etat !== 'jeu' || enPause) return; enPause = true; appui = false; lacherDemande = false; Musique.arreter(); majReglages(); montrer('pause'); };
$('p-reprendre').onclick = () => { enPause = false; montrer(null); Musique.lancer(); };
$('p-rejouer').onclick = jouer;
$('p-menu').onclick = () => { enPause = false; afficherAccueil(); };
$('p-son').onclick = () => { Son.actif = !Son.actif; Sauve.ecrire('son', Son.actif); majReglages(); };
$('p-musique').onclick = () => { Musique.actif = !Musique.actif; Sauve.ecrire('musique', Musique.actif); majReglages(); };
$('p-vibre').onclick = () => { Vibre.actif = !Vibre.actif; Sauve.ecrire('vibre', Vibre.actif); majReglages(); Vibre.court(3); };
function afficherAccueil() { Musique.arreter(); tFin = 0; demo(); $('hud').hidden = true; $('a-record').textContent = record ? 'Record : ' + record : 'Fais fusionner les Pompons jusqu\'au Roi Pompon !'; montrer('accueil'); }

// ----- Contrôles : on vise en glissant, on lâche en levant le doigt -----
const versBocal = e => (e.clientX - ox) / ech;
let appui = false;
cv.addEventListener('pointerdown', e => { Son.init(); if (etat !== 'jeu' || enPause) return; appui = true; viseX = versBocal(e); try { cv.setPointerCapture(e.pointerId); } catch (er) { } e.preventDefault(); });
cv.addEventListener('pointermove', e => { if (etat !== 'jeu' || enPause) return; if (appui || e.pointerType === 'mouse') viseX = versBocal(e); });
cv.addEventListener('pointerup', e => { if (!appui) return; appui = false; viseX = versBocal(e); lacher(); });
cv.addEventListener('pointercancel', () => { appui = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (enPause) $('p-reprendre').click(); else $('b-pause').click(); }
  if (etat === 'jeu' && !enPause) { if (e.key === 'ArrowLeft') viseX = clamp(viseX - 20, 0, BW); if (e.key === 'ArrowRight') viseX = clamp(viseX + 20, 0, BW); if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); lacher(); } }
});

// Appli en arrière-plan : pause du jeu et du son
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (etat === 'jeu' && !enPause) $('b-pause').click(); Musique.arreter(); if (Son.ac && Son.ac.state === 'running') Son.ac.suspend(); }
  else if (Son.ac && Son.ac.state === 'suspended') Son.ac.resume();
});
// Bouton retour d'Android (appli Capacitor)
const AppNative = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (AppNative) AppNative.addListener('backButton', () => {
  if (!$('pause').hidden) $('p-reprendre').click();
  else if (etat === 'jeu') $('b-pause').click();
  else if (etat === 'fin') $('f-menu').click();
  else AppNative.exitApp();
});

let tPrec = performance.now(), nbImages = 0;
function boucle(t) {
  const dt = Math.min(0.05, (t - tPrec) / 1000); tPrec = t;
  maj(dt); dessiner();
  // les marges système peuvent arriver après le chargement : on revérifie de temps en temps
  if (++nbImages % 60 === 0) { const cs = getComputedStyle(sonde); if ((parseFloat(cs.paddingTop) || 0) !== MH || (parseFloat(cs.paddingBottom) || 0) !== MB) redim(); }
  requestAnimationFrame(boucle);
}
redim(); afficherAccueil();
requestAnimationFrame(boucle);

</script>
