:root { --vert: #3fae6a; --vert-f: #2b8a50; --texte: #4a3a5a; --lav: #8566dd; --rose: #ff6fa3; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; font-family: 'Nunito', sans-serif; color: var(--texte); touch-action: none; overscroll-behavior: none; }
#jeu { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#sonde-bords { position: fixed; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.ecran { position: fixed; inset: 0; display: none; pointer-events: none; }
.ecran.on { display: block; }
.ecran.on > * { pointer-events: auto; }
button { font-family: 'Fredoka', sans-serif; font-weight: 600; border: 0; cursor: pointer; color: #fff; }
.btn { font-size: 24px; padding: 11px 34px 13px; border-radius: 999px; background: linear-gradient(#ffa6c9, #ff6fa3); box-shadow: 0 5px 0 #d84f86, 0 10px 18px rgba(200,70,130,.28); text-shadow: 0 2px 0 rgba(170,40,100,.3); transition: transform .08s; letter-spacing: .3px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d84f86, 0 5px 10px rgba(200,70,130,.3); }
.btn.vert { background: linear-gradient(#8ee6a8, #3fbf72); box-shadow: 0 5px 0 #2a9a56, 0 10px 18px rgba(50,160,90,.3); text-shadow: 0 2px 0 rgba(30,120,70,.3); }
.btn.vert:active { box-shadow: 0 2px 0 #2a9a56; }
.btn.lav { background: linear-gradient(#cdb8ff, #9575ee); box-shadow: 0 5px 0 #7457cc, 0 10px 18px rgba(120,90,210,.3); text-shadow: 0 2px 0 rgba(90,60,170,.3); }
.btn.lav:active { box-shadow: 0 2px 0 #7457cc; }
.btn.petit { font-size: 18px; padding: 8px 22px 10px; }
.rond { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 4px 12px rgba(40,70,90,.2); display: grid; place-items: center; padding: 0; transition: transform .1s; }
.rond:active { transform: scale(.9); }
.rond svg { width: 26px; height: 26px; }
.rond img { width: 34px; height: 34px; }

/* titre */
#titre .contenu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 14px; padding: calc(env(safe-area-inset-top) + 9vh) 16px env(safe-area-inset-bottom); pointer-events: none; }
#titre .contenu > * { pointer-events: auto; }
.logo { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(56px, 18vw, 104px); line-height: .92; margin: 0; text-align: center; }
.logo span { display: inline-block; -webkit-text-stroke: 11px #fff; paint-order: stroke fill; text-shadow: 0 7px 0 rgba(255,255,255,.55), 0 14px 26px rgba(60,90,160,.3); animation: lettre 2.6s ease-in-out infinite; }
@keyframes lettre { 0%,100% { transform: translateY(0) rotate(0) } 30% { transform: translateY(-9px) rotate(-3deg) } 60% { transform: translateY(0) rotate(2deg) } }
#sous-titre { font-weight: 800; font-size: 18px; color: #4a6f9a; background: rgba(255,255,255,.75); padding: 3px 16px; border-radius: 99px; }
#b-jouer { margin-top: 2vh; font-size: 32px; padding: 14px 60px 16px; animation: respire 2s ease-in-out infinite; }
@keyframes respire { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
#titre .coin { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 14px; }

/* barres du haut */
.haut { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none !important; }
.haut > * { pointer-events: auto; }
.haut .groupe { display: flex; gap: 8px; }
.total { background: rgba(255,255,255,.94); border-radius: 99px; padding: 5px 16px 5px 6px; font-family: 'Fredoka'; font-weight: 600; font-size: 19px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(40,70,90,.2); color: #6b4a8a; }
.total img { width: 34px; height: 34px; }
#titre-niveau { font-family: 'Fredoka'; font-weight: 600; font-size: 21px; color: #6b4a8a; text-align: center; line-height: 1; background: rgba(255,255,255,.9); padding: 6px 18px 7px; border-radius: 20px; box-shadow: 0 4px 12px rgba(40,70,90,.18); }
#titre-niveau small { display: block; font-family: 'Nunito'; font-weight: 800; font-size: 12px; color: #8f7aa8; margin-top: 2px; }

/* panier de plantes */
#panier { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); display: flex; gap: 14px; padding: 10px 14px; background: rgba(255,255,255,.88); border-radius: 30px; box-shadow: 0 8px 24px rgba(30,60,40,.22); }
#panier.secoue { animation: secoue .4s; }
@keyframes secoue { 0%,100% { transform: translateX(-50%) } 20% { transform: translateX(calc(-50% - 8px)) } 40% { transform: translateX(calc(-50% + 8px)) } 60% { transform: translateX(calc(-50% - 5px)) } 80% { transform: translateX(calc(-50% + 4px)) } }
.case-panier { position: relative; width: 86px; height: 86px; border-radius: 22px; background: linear-gradient(#f2fbe9, #dff3d0); box-shadow: inset 0 -4px 0 rgba(60,120,60,.15); display: grid; place-items: center; padding: 0; color: var(--texte); touch-action: none; transition: transform .12s; }
.case-panier img { width: 60px; height: 60px; margin-top: -10px; pointer-events: none; }
.case-panier .nb { position: absolute; top: -8px; right: -8px; min-width: 30px; height: 30px; border-radius: 15px; background: var(--rose); color: #fff; font-family: 'Fredoka'; font-weight: 600; font-size: 18px; display: grid; place-items: center; box-shadow: 0 3px 0 #d84f86; border: 2px solid #fff; }
.case-panier .nom { position: absolute; bottom: 5px; left: 0; right: 0; font-family: 'Nunito'; font-weight: 800; font-size: 12px; color: #4f8a4a; }
.case-panier.sel { background: linear-gradient(#fffbe0, #ffefa8); box-shadow: 0 0 0 3px #ffd24a, inset 0 -4px 0 rgba(200,150,40,.2); transform: translateY(-3px); }
.case-panier.vide { opacity: .45; }
.case-panier.vide .nb { background: #b9b2c4; box-shadow: 0 3px 0 #9890a8; }

/* bulle de Mélo */
#bulle { position: fixed; left: 0; top: 0; max-width: min(260px, 66vw); background: #fff; color: var(--texte); font-weight: 800; font-size: 15px; line-height: 1.25; padding: 10px 14px; border-radius: 18px; box-shadow: 0 6px 18px rgba(40,60,90,.22); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 5; }
#bulle.on { opacity: 1; }

/* fondu */
#fondu { position: fixed; inset: 0; background: #fffdf3; opacity: 0; pointer-events: none; transition: opacity .26s; z-index: 20; }
#fondu.on { opacity: 1; }

/* fenêtres */
#voile { position: fixed; inset: 0; background: rgba(40,40,80,.32); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#voile.on { display: flex; }
.carte-pop { position: relative; width: min(100%, 370px); background: linear-gradient(#fff, #f6fff4); border-radius: 30px; padding: 46px 22px 22px; text-align: center; box-shadow: 0 20px 50px rgba(40,50,90,.35); animation: entre .4s cubic-bezier(.2,1.4,.4,1); border: 4px solid #fff; }
@keyframes entre { from { transform: scale(.6) translateY(30px); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.ruban { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka'; font-weight: 600; font-size: 25px; color: #fff; padding: 8px 28px 10px; border-radius: 16px; background: linear-gradient(#8ee6a8, #3fbf72); box-shadow: 0 6px 0 #2a9a56; white-space: nowrap; }
.ruban.lav { background: linear-gradient(#cdb8ff, #9575ee); box-shadow: 0 6px 0 #7457cc; }

<script>
'use strict';
// ===== Commun : compatibilité, sauvegarde, vibrations, sons et musique =====
if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    let t = Array.isArray(r) ? r : [r || 0];
    if (t.length === 1) t = [t[0], t[0], t[0], t[0]];
    const m = Math.min(Math.abs(w), Math.abs(h)) / 2, [a, b, c, d] = t.map(v => Math.max(0, Math.min(+v || 0, m)));
    this.moveTo(x + a, y); this.lineTo(x + w - b, y); this.arcTo(x + w, y, x + w, y + b, b);
    this.lineTo(x + w, y + h - c); this.arcTo(x + w, y + h, x + w - c, y + h, c);
    this.lineTo(x + d, y + h); this.arcTo(x, y + h, x, y + h - d, d);
    this.lineTo(x, y + a); this.arcTo(x, y, x + a, y, a); this.closePath();
  };
}
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elast: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - 0.75) * 2.0944) + 1,
};
const hasard = (() => { let g = 7; return () => { g = (g * 16807) % 2147483647; return g / 2147483647; }; })();

// ----- sauvegarde -----
const SAUVE = (() => {
  const P = 'jardin-sonore.';
  const mem = {};
  const lire = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } };
  const ecrire = (k, v) => { mem[k] = v; try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) { } };
  return { lire, ecrire };
})();
const reglages = Object.assign({ musique: true, sons: true, vibrations: true }, SAUVE.lire('reglages', {}));
function sauverReglages() { SAUVE.ecrire('reglages', reglages); }

function vibrer(force) {
  if (!reglages.vibrations) return;
  try {
    const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
    if (H) { H.impact({ style: force === 'fort' ? 'MEDIUM' : 'LIGHT' }); return; }
    if (navigator.vibrate) navigator.vibrate(force === 'fort' ? 20 : 7);
  } catch (e) { }
}

// ----- sons : tout est synthétisé en direct -----
const SON = (() => {
  let ac = null, maitre, busSons, busMus, busNat, envoi, bruitBuf;
  // gammes pentatoniques par monde (racine MIDI + intervalles)
  const GAMMES = [
    { r: 60, i: [0, 2, 4, 7, 9] },     // Prairie : do majeur
    { r: 62, i: [0, 2, 4, 7, 9] },     // Ruisseau : ré
    { r: 65, i: [0, 2, 4, 7, 9] },     // Rocaille : fa
    { r: 57, i: [0, 3, 5, 7, 10] },    // Champignons : la mineur
    { r: 63, i: [0, 2, 4, 7, 11] },    // Lune : mi bémol, couleur lydienne
    { r: 55, i: [0, 2, 4, 7, 9] },     // Étoiles : sol
  ];
  let monde = 0;
  function hauteur(degre, m) {
    const g = GAMMES[m == null ? monde : m], n = g.i.length;
    const o = Math.floor(degre / n), k = ((degre % n) + n) % n;
    return g.r + o * 12 + g.i[k];
  }
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    try { ac = new C(); } catch (e) { ac = null; return; }
    maitre = ac.createGain(); maitre.gain.value = 0.85;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.01;
    maitre.connect(comp); comp.connect(ac.destination);
    busSons = ac.createGain(); busSons.connect(maitre);
    busMus = ac.createGain(); busMus.connect(maitre);
    busNat = ac.createGain(); busNat.connect(maitre);
    // grande réverbération douce (jardin en plein air)
    const rev = ac.createConvolver();
    const n = ac.sampleRate * 2.8 | 0, buf = ac.createBuffer(2, n, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) { lp = lp * 0.55 + (Math.random() * 2 - 1) * 0.45; d[i] = lp * Math.pow(1 - i / n, 2.2) * (i < 400 ? i / 400 : 1); }
    }
    rev.buffer = buf; envoi = ac.createGain(); envoi.gain.value = 0.5; envoi.connect(rev);
    const rg = ac.createGain(); rg.gain.value = 0.55; rev.connect(rg); rg.connect(maitre);
    bruitBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const b = bruitBuf.getChannelData(0); for (let i = 0; i < b.length; i++) b[i] = Math.random() * 2 - 1;
    maj();
  }
  const fq = m => 440 * Math.pow(2, (m - 69) / 12);
  const T = () => ac ? ac.currentTime + 0.01 : 0;
  function env(g, t0, att, vol, dur) {
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + att); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function osc(type, f, t0, dur, vol, sortie, att, rev) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; env(g, t0, att || 0.005, vol, dur);
    o.connect(g); g.connect(sortie || busSons); if (rev !== 0) { const s = ac.createGain(); s.gain.value = rev == null ? 1 : rev; g.connect(s); s.connect(envoi); }
    o.start(t0); o.stop(t0 + dur + 0.05); return o;
  }
  function bruit(t0, dur, f, q, vol, f2, sortie, type) {
    const s = ac.createBufferSource(); s.buffer = bruitBuf; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type || 'bandpass'; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = ac.createGain(); env(g, t0, Math.min(0.02, dur / 3), vol, dur);
    s.connect(fl); fl.connect(g); g.connect(sortie || busSons); g.connect(envoi);
    s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
  }
  // instruments
  const I = {
    kalimba(m, t, v) { const f = fq(m); osc('sine', f, t, 1.6, 0.3 * v); osc('sine', f * 2, t, 0.35, 0.05 * v); osc('sine', f * 5.95, t, 0.07, 0.04 * v, null, 0.002); bruit(t, 0.012, 3500, 2, 0.05 * v); },
    cloche(m, t, v) {
      const f = fq(m), c = ac.createOscillator(), mo = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
      c.frequency.value = f; mo.frequency.value = f * 3.5; mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.4);
      mo.connect(mg); mg.connect(c.frequency); env(g, t, 0.004, 0.22 * v, 2.6); c.connect(g); g.connect(busSons); g.connect(envoi);
      c.start(t); mo.start(t); c.stop(t + 2.7); mo.stop(t + 2.7);
      osc('sine', f * 2, t, 1.4, 0.06 * v);
    },
    marimba(m, t, v) { const f = fq(m); osc('sine', f, t, 0.5, 0.22 * v, null, 0.003); osc('sine', f * 4, t, 0.06, 0.07 * v, null, 0.002); },
    harpe(m, t, v) {
      const f = fq(m), o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f * 8, t); fl.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.8);
      env(g, t, 0.004, 0.2 * v, 1.3); o.connect(fl); fl.connect(g); g.connect(busSons); g.connect(envoi); o.start(t); o.stop(t + 1.4);
    },
    souffle(m, t, v) { const f = fq(m); osc('sine', f, t, 0.9, 0.12 * v, null, 0.12); bruit(t, 0.5, f * 2, 6, 0.05 * v); },
  };
  const jouer = {
    clic() { if (!ac) return; const t = T(); I.marimba(84, t, 0.6); },
    pose(deg) { if (!ac) return; const t = T(); bruit(t, 0.09, 2400, 1.2, 0.12, 4200); I.marimba(hauteur(deg + 5), t + 0.01, 0.5); },
    tourne(deg) { if (!ac) return; const t = T(); bruit(t, 0.06, 3000, 1.5, 0.1, 1800); I.marimba(hauteur(deg + 6), t, 0.35); },
    retire() { if (!ac) return; const t = T(); bruit(t, 0.12, 1800, 1, 0.1, 600); osc('sine', 520, t, 0.12, 0.08).frequency.exponentialRampToValueAtTime(260, t + 0.12); },
    refus() { if (!ac) return; const t = T(); osc('triangle', 196, t, 0.14, 0.12); osc('triangle', 185, t + 0.08, 0.16, 0.1); },
    // notes du jardin, appelées pendant la mélodie
    note(type, deg, quand, vol) {
      if (!ac) return; const t = Math.max(T(), quand || 0), v = vol == null ? 1 : vol;
      if (type === 'cloche') I.cloche(hauteur(deg - 5), t, v);
      else if (type === 'bud') I.kalimba(hauteur(deg), t, v);
      else if (type === 'lys') { I.kalimba(hauteur(deg), t, v * 0.8); I.kalimba(hauteur(deg + 2), t + 0.03, v * 0.6); }
      else if (type === 'feuille') I.marimba(hauteur(deg), t, v * 0.55);
      else if (type === 'pissenlit') { for (let k = 0; k < 4; k++) I.harpe(hauteur(deg + k), t + k * 0.04, v * 0.5); }
      else if (type === 'portail') { bruit(t, 0.4, 600, 3, 0.12 * v, 2400); I.souffle(hauteur(deg + 5), t + 0.05, v * 0.8); }
      else if (type === 'roc') { osc('sine', 110, t, 0.12, 0.1 * v, null, 0.002).frequency.exponentialRampToValueAtTime(70, t + 0.1); }
    },
    eclot(deg) { if (!ac) return; const t = T(); bruit(t, 0.25, 1500, 1, 0.08, 6000); [0, 2, 4].forEach((k, i) => osc('sine', fq(hauteur(deg + 5 + k)), t + 0.05 + i * 0.05, 0.6, 0.05)); },
    victoire() {
      if (!ac) return; const t = T();
      [0, 1, 2, 3, 4, 5, 7, 9].forEach((d, i) => I.cloche(hauteur(d + 5), t + i * 0.09, 0.55));
      [0, 2, 4].forEach(d => osc('sine', fq(hauteur(d - 5)), t, 3, 0.05, null, 0.5));
    },
    fleur() { if (!ac) return; const t = T(); [0, 2, 4, 7].forEach((d, i) => I.kalimba(hauteur(d + 3), t + i * 0.07, 0.7)); },
    page() { if (!ac) return; bruit(T(), 0.18, 1200, 0.8, 0.06, 3200); },
    indice() { if (!ac) return; const t = T(); [4, 6, 9].forEach((d, i) => I.cloche(hauteur(d + 5), t + i * 0.08, 0.35)); },
  };

  // ----- ambiance : nappes + petite boîte à musique + sons de nature, selon le monde -----
  let musOn = false, prochain = 0, pas = 0, minuteur = null, eteinte = 0;
  const PROGS = [[0, 5, 3, 4], [0, 3, 5, 4], [0, 4, 5, 3], [0, 5, 6, 4], [0, 4, 1, 5], [0, 5, 3, 4]];
  let natNoeuds = [];
  function nappe(rootDeg, t, dur) {
    const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 900; fl.Q.value = 0.3;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 2.2); g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.5);
    fl.connect(g); g.connect(busMus); g.connect(envoi);
    [0, 2, 4].forEach(k => {
      const m = hauteur(rootDeg + k - 10);
      [-6, 6].forEach(det => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fq(m); o.detune.value = det; o.connect(fl); o.start(t); o.stop(t + dur + 1.6); });
    });
    osc('sine', fq(hauteur(rootDeg - 10) - 0) / 2, t, dur, 0.06, busMus, 1.2, 0.2);
  }
  function planifier() {
    if (!ac || !musOn) return;
    const croche = 0.42;
    while (prochain < ac.currentTime + 0.8) {
      const prog = PROGS[monde % PROGS.length], mes = Math.floor(pas / 16) % 4, k = pas % 16, racine = prog[mes];
      if (k === 0) nappe(racine, prochain, croche * 16);
      // boîte à musique clairsemée, uniquement dans la gamme
      if (hasard() < (k % 4 === 0 ? 0.5 : k % 2 === 0 ? 0.22 : 0.08)) {
        const deg = racine + [0, 2, 4, 5, 7][Math.floor(hasard() * 5)];
        const t = prochain, m = hauteur(deg);
        osc('sine', fq(m), t, 1.6, 0.05, busMus, 0.004); osc('sine', fq(m) * 5.95, t, 0.05, 0.008, busMus, 0.002);
      }
      // nature
      if (k === 8 && hasard() < 0.5) natureEvenement(prochain);
      prochain += croche; pas++;
    }
  }
  function natureEvenement(t) {
    const m = monde;
    if (m === 0 || m === 2) { // oiseaux
      const n = 2 + Math.floor(hasard() * 4), base = 2600 + hasard() * 1400;
      for (let i = 0; i < n; i++) { const o = osc('sine', base, t + i * 0.11, 0.08, 0.025, busNat, 0.01, 0.3); o.frequency.setValueAtTime(base * (1 + hasard() * 0.3), t + i * 0.11); o.frequency.exponentialRampToValueAtTime(base * 0.8, t + i * 0.11 + 0.08); }
    } else if (m === 3 || m === 5) { // grillons
      for (let i = 0; i < 6; i++) osc('sine', 4400, t + i * 0.06, 0.035, 0.012, busNat, 0.005, 0.2);
    } else if (m === 1 || m === 4) { // gouttes d'eau
      const f = 900 + hasard() * 900, o = osc('sine', f, t, 0.12, 0.03, busNat, 0.003, 0.6); o.frequency.exponentialRampToValueAtTime(f * 2.2, t + 0.08);
    }
  }
  function fondNature() {
    natNoeuds.forEach(n => { try { n.stop(); } catch (e) { } }); natNoeuds = [];
    if (!ac) return;
    // vent, ou ruisseau, en continu
    const s = ac.createBufferSource(); s.buffer = bruitBuf; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = 'bandpass';
    const eau = monde === 1 || monde === 4;
    fl.frequency.value = eau ? 900 : 500; fl.Q.value = eau ? 0.9 : 0.6;
    const g = ac.createGain(); g.gain.value = eau ? 0.03 : 0.014;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = eau ? 0.31 : 0.07; lg.gain.value = eau ? 300 : 260;
    lfo.connect(lg); lg.connect(fl.frequency);
    s.connect(fl); fl.connect(g); g.connect(busNat); s.start(); lfo.start();
    natNoeuds.push(s, lfo);
  }
  function musique(on, m) {
    if (m != null && m !== monde) { monde = m; if (ac && musOn) fondNature(); }
    if (!ac) { musOn = on; return; }
    if (on && !musOn) { musOn = true; prochain = ac.currentTime + 0.1; pas = 0; fondNature(); }

    if (lueur > 0 && on) {
      const gl = g.createRadialGradient(hx, hy, 0, hx, hy, R * 2.4);
      gl.addColorStop(0, 'rgba(255,250,200,' + 0.55 * lueur + ')'); gl.addColorStop(1, 'rgba(255,250,200,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(hx, hy, R * 2.4, 0, TAU); g.fill();
    }
    if (o > 0.15) dessinerFleur(g, hx, hy, R * 1.25, esp, (o - 0.15) / 0.85, t, 0);
    if (o < 0.6) {
      // bouton fermé : goutte colorée entre deux sépales
      const k = 1 - clamp(o / 0.6, 0, 1);
      g.save(); g.translate(hx, hy); g.scale(k * 0.4 + 0.6, k * 0.4 + 0.6); g.globalAlpha = 0.4 + 0.6 * k;
      const gb = g.createLinearGradient(0, -R, 0, R);
      gb.addColorStop(0, E.c[0]); gb.addColorStop(1, E.c[1]);
      g.fillStyle = gb; g.beginPath(); g.moveTo(0, -R * 1.05); g.bezierCurveTo(R * 0.85, -R * 0.4, R * 0.7, R * 0.6, 0, R * 0.7); g.bezierCurveTo(-R * 0.7, R * 0.6, -R * 0.85, -R * 0.4, 0, -R * 1.05); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(-R * 0.25, -R * 0.35, R * 0.12, R * 0.28, 0.3, 0, TAU); g.fill();
      g.fillStyle = '#58ac4a';
      g.beginPath(); g.moveTo(0, R * 0.75); g.quadraticCurveTo(-R * 0.9, R * 0.5, -R * 0.55, -R * 0.2); g.quadraticCurveTo(-R * 0.25, R * 0.3, 0, R * 0.75); g.fill();
      g.beginPath(); g.moveTo(0, R * 0.75); g.quadraticCurveTo(R * 0.9, R * 0.5, R * 0.55, -R * 0.2); g.quadraticCurveTo(R * 0.25, R * 0.3, 0, R * 0.75); g.fill();
      g.restore();
    }
  }
  if (jumeau) { // deux petits points : combien de directions il faut
    for (let k = 0; k < 2; k++) { g.fillStyle = k < nbTouche ? '#fff6a8' : 'rgba(255,255,255,.45)'; g.beginPath(); g.arc((k - 0.5) * s * 0.14, s * 0.36, s * 0.04, 0, TAU); g.fill(); }
  }
  g.restore();
}

// ----- cloche (source de la mélodie) -----
function dessinerCloche(g, x, y, s, d, k, t, joue) {
  const C = COUL_SOURCES[k % 2];
  g.save(); g.translate(x, y);
  // socle : petit coussin de mousse
  g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(0, s * 0.3, s * 0.32, s * 0.1, 0, 0, TAU); g.fill();
  g.fillStyle = '#5aa84a'; g.beginPath(); g.ellipse(0, s * 0.24, s * 0.3, s * 0.12, 0, 0, TAU); g.fill();
  g.fillStyle = '#76c45f'; g.beginPath(); g.ellipse(-s * 0.04, s * 0.2, s * 0.22, s * 0.07, 0, 0, TAU); g.fill();
  // ondes sonores vers la direction
  const ang = [0, Math.PI / 2, Math.PI, -Math.PI / 2][d];
  g.save(); g.rotate(ang);
  for (let i = 0; i < 3; i++) {
    const ph = ((t * 0.9 + i / 3) % 1);
    g.strokeStyle = C[2]; g.globalAlpha = (1 - ph) * 0.8; g.lineWidth = s * 0.05; g.lineCap = 'round';
    g.beginPath(); g.arc(s * 0.12, 0, s * (0.3 + ph * 0.32), -0.6, 0.6); g.stroke();
  }
  g.globalAlpha = 1; g.restore();
  // la cloche elle-même (campanule), ouverture tournée vers la direction
  const sw = Math.sin(t * (joue ? 14 : 2.2)) * (joue ? 0.25 : 0.06);
  g.rotate(ang + sw);
  const gr = g.createLinearGradient(-s * 0.3, -s * 0.2, s * 0.3, s * 0.2);
  gr.addColorStop(0, C[0]); gr.addColorStop(1, C[1]);
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(-s * 0.26, -s * 0.1);
  g.quadraticCurveTo(-s * 0.3, -s * 0.24, -s * 0.12, -s * 0.24);
  g.quadraticCurveTo(s * 0.1, -s * 0.24, s * 0.2, -s * 0.3);
  g.quadraticCurveTo(s * 0.16, -s * 0.2, s * 0.25, -s * 0.14);
  g.quadraticCurveTo(s * 0.2, 0, s * 0.25, s * 0.14);
  g.quadraticCurveTo(s * 0.16, s * 0.2, s * 0.2, s * 0.3);
  g.quadraticCurveTo(s * 0.1, s * 0.24, -s * 0.12, s * 0.24);
  g.quadraticCurveTo(-s * 0.3, s * 0.24, -s * 0.26, s * 0.1);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(-s * 0.06, -s * 0.12, s * 0.14, s * 0.04, -0.1, 0, TAU); g.fill();
  g.fillStyle = 'rgba(60,20,120,.25)'; g.beginPath(); g.ellipse(s * 0.21, 0, s * 0.04, s * 0.2, 0, 0, TAU); g.fill();
  g.fillStyle = '#ffe680'; g.beginPath(); g.arc(s * 0.27, 0, s * 0.055, 0, TAU); g.fill();
  g.fillStyle = '#5aa84a'; g.beginPath(); g.ellipse(-s * 0.28, 0, s * 0.06, s * 0.12, 0, 0, TAU); g.fill();
  g.restore();
}

// ----- feuille (renvoie l'onde) -----
function dessinerFeuille(g, x, y, s, type, fixe, t, appui) {
  g.save(); g.translate(x, y);
  if (fixe) { // pot en pierre : on ne peut pas la déplacer
    g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(0, s * 0.06, s * 0.42, s * 0.42, 0, 0, TAU); g.fill();
    g.fillStyle = '#b9b2a6'; g.beginPath(); g.arc(0, 0, s * 0.42, 0, TAU); g.fill();
    g.fillStyle = '#d6d0c4'; g.beginPath(); g.arc(-s * 0.03, -s * 0.03, s * 0.36, 0, TAU); g.fill();
    g.fillStyle = '#8f8678'; g.beginPath(); g.arc(0, 0, s * 0.3, 0, TAU); g.fill();
  } else {
    g.fillStyle = 'rgba(30,70,20,.2)'; g.beginPath(); g.ellipse(s * 0.03, s * 0.08, s * 0.34, s * 0.14, type === 1 ? -0.78 : 0.78, 0, TAU); g.fill();
  }
  const sc = 1 + (appui || 0) * 0.15;
  g.scale(sc, sc);
  g.rotate(type === 1 ? -Math.PI / 4 : Math.PI / 4);
  g.rotate(Math.sin(t * 1.4 + x) * 0.03);
  const L = s * 0.5, H = s * 0.2;
  const gr = g.createLinearGradient(0, -H, 0, H);
  gr.addColorStop(0, fixe ? '#7fb36a' : '#8fe06a'); gr.addColorStop(0.5, fixe ? '#5f9a52' : '#4fbf4a'); gr.addColorStop(1, fixe ? '#467a3e' : '#2f9a3f');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(-L, 0); g.bezierCurveTo(-L * 0.5, -H * 1.6, L * 0.5, -H * 1.5, L, 0); g.bezierCurveTo(L * 0.5, H * 1.5, -L * 0.5, H * 1.6, -L, 0); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = s * 0.025; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-L * 0.92, 0); g.quadraticCurveTo(0, -H * 0.12, L * 0.9, 0); g.stroke();
  g.lineWidth = s * 0.015; g.globalAlpha = 0.45;
  for (let i = -2; i <= 2; i++) { if (!i) continue; const px = i * L * 0.28; g.beginPath(); g.moveTo(px, 0); g.lineTo(px + L * 0.18, -H * 0.75); g.moveTo(px, 0); g.lineTo(px + L * 0.18, H * 0.75); g.stroke(); }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.3)'; g.beginPath(); g.ellipse(-L * 0.2, -H * 0.55, L * 0.35, H * 0.18, 0, 0, TAU); g.fill();
  // gouttelette de rosée
  g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(L * 0.35, H * 0.3, s * 0.03, 0, TAU); g.fill();
  g.restore();
}

// ----- pissenlit (sépare l'onde) -----
function dessinerPissenlit(g, x, y, s, fixe, t, appui) {
  g.save(); g.translate(x, y);
  if (fixe) {
    g.fillStyle = '#b9b2a6'; g.beginPath(); g.arc(0, 0, s * 0.42, 0, TAU); g.fill();
    g.fillStyle = '#d6d0c4'; g.beginPath(); g.arc(-s * 0.03, -s * 0.03, s * 0.36, 0, TAU); g.fill();
  }
  const sc = 1 + (appui || 0) * 0.15; g.scale(sc, sc);
  g.fillStyle = 'rgba(30,70,20,.18)'; g.beginPath(); g.ellipse(0, s * 0.3, s * 0.22, s * 0.07, 0, 0, TAU); g.fill();
  g.strokeStyle = '#5fa84a'; g.lineWidth = s * 0.045; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, s * 0.3); g.quadraticCurveTo(s * 0.05, s * 0.12, 0, 0); g.stroke();
  const R = s * 0.3, bal = Math.sin(t * 1.8 + x) * 0.05;
  g.rotate(bal);
  const gl = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.2);
  gl.addColorStop(0, 'rgba(255,255,255,.95)'); gl.addColorStop(0.6, 'rgba(255,255,255,.55)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(0, 0, R * 1.2, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = s * 0.012;
  for (let i = 0; i < 26; i++) {
    const a = i * 2.39996, r2 = R * (0.75 + (i % 3) * 0.1);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(Math.cos(a) * r2, Math.sin(a) * r2, s * 0.022, 0, TAU); g.fill();
  }
  g.fillStyle = '#c9b48a'; g.beginPath(); g.arc(0, 0, s * 0.06, 0, TAU); g.fill();
  g.restore();
}

// ----- obstacles -----
function dessinerRoc(g, x, y, s, seed, m) {
  const r = rnd(seed), kind = Math.floor(r() * 3), nuit = MONDES[m].nuit;
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(20,40,20,.22)'; g.beginPath(); g.ellipse(0, s * 0.28, s * 0.38, s * 0.12, 0, 0, TAU); g.fill();
  if (kind === 0) { // pierre moussue
    const gr = g.createLinearGradient(0, -s * 0.3, 0, s * 0.3);
    gr.addColorStop(0, nuit > 0.5 ? '#9aa3b8' : '#d8d2c8'); gr.addColorStop(1, nuit > 0.5 ? '#5e667e' : '#9a9286');
    g.fillStyle = gr; g.beginPath();
    g.moveTo(-s * 0.36, s * 0.25); g.quadraticCurveTo(-s * 0.42, -s * 0.12, -s * 0.12, -s * 0.28); g.quadraticCurveTo(s * 0.2, -s * 0.36, s * 0.36, -s * 0.06); g.quadraticCurveTo(s * 0.44, s * 0.2, s * 0.3, s * 0.28); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-s * 0.1, -s * 0.16, s * 0.14, s * 0.05, -0.3, 0, TAU); g.fill();
    g.fillStyle = '#7cbf5a'; g.beginPath(); g.ellipse(s * 0.14, -s * 0.2, s * 0.16, s * 0.06, 0.4, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(-s * 0.28, s * 0.14, s * 0.08, s * 0.1, 0.2, 0, TAU); g.fill();
  } else if (kind === 1) { // souche
    g.fillStyle = nuit > 0.5 ? '#6b5450' : '#a8774f'; g.beginPath(); g.roundRect(-s * 0.3, -s * 0.12, s * 0.6, s * 0.4, s * 0.06); g.fill();
    g.fillStyle = nuit > 0.5 ? '#8e7466' : '#e3b98a'; g.beginPath(); g.ellipse(0, -s * 0.12, s * 0.3, s * 0.12, 0, 0, TAU); g.fill();
    g.strokeStyle = nuit > 0.5 ? '#6b5450' : '#c0905f'; g.lineWidth = s * 0.02;
    for (let k = 1; k < 3; k++) { g.beginPath(); g.ellipse(0, -s * 0.12, s * 0.1 * k, s * 0.04 * k, 0, 0, TAU); g.stroke(); }
    g.fillStyle = '#ff7a6b'; g.beginPath(); g.arc(s * 0.26, s * 0.2, s * 0.07, Math.PI, 0); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 0.24, s * 0.17, s * 0.015, 0, TAU); g.fill();
  } else { // buisson à baies
    const cols = nuit > 0.5 ? ['#2f6b5a', '#3f8a6f'] : ['#4f9f45', '#6cc05a'];
    [[-0.17, 0.06, 0.2], [0.17, 0.06, 0.2], [0, -0.1, 0.24]].forEach(([a, b, c]) => { g.fillStyle = cols[0]; g.beginPath(); g.arc(a * s, b * s, c * s, 0, TAU); g.fill(); });
    [[-0.12, 0.0, 0.13], [0.06, -0.15, 0.13]].forEach(([a, b, c]) => { g.fillStyle = cols[1]; g.beginPath(); g.arc(a * s, b * s, c * s, 0, TAU); g.fill(); });
    for (let k = 0; k < 5; k++) { g.fillStyle = k % 2 ? '#ff5f87' : '#ffd25a'; g.beginPath(); g.arc((r() - 0.5) * s * 0.5, (r() - 0.5) * s * 0.35, s * 0.035, 0, TAU); g.fill(); }
  }
  g.restore();
}

function dessinerPortail(g, x, y, s, paire, t) {
  const C = COUL_PORTAILS[paire % 2];
  g.save(); g.translate(x, y);
  const gl = g.createRadialGradient(0, 0, 0, 0, 0, s * 0.45);
  gl.addColorStop(0, C[0] + 'cc'); gl.addColorStop(0.6, C[1] + '55'); gl.addColorStop(1, C[1] + '00');
  g.fillStyle = gl; g.beginPath(); g.arc(0, 0, s * 0.45, 0, TAU); g.fill();
  // tourbillon
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = s * 0.025; g.lineCap = 'round';
  for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(0, 0, s * (0.08 + k * 0.07), t * 2 + k * 2, t * 2 + k * 2 + 2.2); g.stroke(); }
  // anneau de champignons
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU + 0.3, mx = Math.cos(a) * s * 0.33, my = Math.sin(a) * s * 0.26 + s * 0.04, sz = s * (0.075 + (i % 2) * 0.02);
    g.fillStyle = '#fff3e0'; g.fillRect(mx - sz * 0.25, my - sz * 0.2, sz * 0.5, sz * 0.8);
    g.fillStyle = C[1]; g.beginPath(); g.arc(mx, my - sz * 0.15, sz, Math.PI, 0); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(mx - sz * 0.35, my - sz * 0.5, sz * 0.18, 0, TAU); g.fill();
  }
  g.restore();
}

// ----- Mélo, l'abeille chef d'orchestre -----
function dessinerMelo(g, x, y, s, t, humeur, dir) {
  g.save(); g.translate(x, y); if (dir < 0) g.scale(-1, 1);
  const vol = Math.sin(t * 3) * s * 0.04;
  g.translate(0, vol);
  // ailes
  const battement = Math.sin(t * 40) * 0.35;
  g.fillStyle = 'rgba(220,245,255,.75)'; g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = s * 0.02;
  [[-0.12, -1], [0.1, 1]].forEach(([ox, k]) => {
    g.save(); g.translate(ox * s, -s * 0.3); g.rotate(-0.4 * k + battement * k);
    g.beginPath(); g.ellipse(0, -s * 0.16, s * 0.12, s * 0.22, 0, 0, TAU); g.fill(); g.stroke(); g.restore();
  });
  // corps
  const gr = g.createRadialGradient(-s * 0.12, -s * 0.12, s * 0.05, 0, 0, s * 0.42);
  gr.addColorStop(0, '#fff3a0'); gr.addColorStop(0.5, '#ffd23f'); gr.addColorStop(1, '#f2a71e');
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, s * 0.42, s * 0.36, 0, 0, TAU); g.fill();
  g.save(); g.beginPath(); g.ellipse(0, 0, s * 0.42, s * 0.36, 0, 0, TAU); g.clip();
  g.fillStyle = '#5a3b2a';
  [-0.06, 0.18].forEach(ox => { g.beginPath(); g.ellipse(ox * s + s * 0.1, 0, s * 0.06, s * 0.4, 0.12, 0, TAU); g.fill(); });
  g.restore();
  // dard
  g.fillStyle = '#5a3b2a'; g.beginPath(); g.moveTo(s * 0.4, s * 0.02); g.lineTo(s * 0.52, s * 0.06); g.lineTo(s * 0.39, s * 0.12); g.fill();
  // antennes
  g.strokeStyle = '#5a3b2a'; g.lineWidth = s * 0.025; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-s * 0.22, -s * 0.28); g.quadraticCurveTo(-s * 0.28, -s * 0.48, -s * 0.18, -s * 0.52); g.stroke();
  g.beginPath(); g.moveTo(-s * 0.08, -s * 0.33); g.quadraticCurveTo(-s * 0.06, -s * 0.52, s * 0.04, -s * 0.54); g.stroke();
  g.fillStyle = '#ff8fb1'; g.beginPath(); g.arc(-s * 0.18, -s * 0.52, s * 0.04, 0, TAU); g.arc(s * 0.04, -s * 0.54, s * 0.04, 0, TAU); g.fill();
  // visage
  const ey = -s * 0.04;
  if (humeur === 'joie') {
    g.strokeStyle = '#3a2418'; g.lineWidth = s * 0.035;
    [[-0.24], [-0.04]].forEach(([ox]) => { g.beginPath(); g.arc(ox * s, ey + s * 0.02, s * 0.05, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); });
  } else {
    const cligne = (t % 4) > 3.86;
    [[-0.24], [-0.04]].forEach(([ox]) => {
      if (cligne) { g.strokeStyle = '#3a2418'; g.lineWidth = s * 0.03; g.beginPath(); g.moveTo(ox * s - s * 0.05, ey); g.lineTo(ox * s + s * 0.05, ey); g.stroke(); return; }
      g.fillStyle = '#3a2418'; g.beginPath(); g.ellipse(ox * s, ey, s * 0.055, s * 0.07, 0, 0, TAU); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(ox * s - s * 0.015, ey - s * 0.025, s * 0.022, 0, TAU); g.fill();
      g.beginPath(); g.arc(ox * s + s * 0.02, ey + s * 0.02, s * 0.01, 0, TAU); g.fill();
    });
  }
  g.fillStyle = 'rgba(255,120,140,.55)'; g.beginPath(); g.ellipse(-s * 0.31, ey + s * 0.09, s * 0.05, s * 0.03, 0, 0, TAU); g.ellipse(s * 0.05, ey + s * 0.09, s * 0.05, s * 0.03, 0, 0, TAU); g.fill();
  g.strokeStyle = '#3a2418'; g.lineWidth = s * 0.03;
  g.beginPath(); if (humeur === 'surprise') g.arc(-s * 0.14, ey + s * 0.12, s * 0.035, 0, TAU); else g.arc(-s * 0.14, ey + s * 0.07, s * (humeur === 'joie' ? 0.07 : 0.045), 0.2, Math.PI - 0.2); g.stroke();
  // baguette de chef d'orchestre
  g.save(); g.translate(-s * 0.36, s * 0.12); g.rotate(-0.9 + Math.sin(t * 5) * (humeur === 'joie' ? 0.6 : 0.2));
  g.strokeStyle = '#fff'; g.lineWidth = s * 0.03; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -s * 0.34); g.stroke();
  g.fillStyle = '#ffe680'; g.beginPath(); g.arc(0, -s * 0.36, s * 0.035, 0, TAU); g.fill();
  g.fillStyle = '#5a3b2a'; g.beginPath(); g.arc(0, 0, s * 0.045, 0, TAU); g.fill();
  g.restore();
  g.restore();
}

// ----- note de musique (particule) -----
function dessinerNote(g, x, y, s, coul, k) {
  g.save(); g.translate(x, y); g.fillStyle = coul; g.strokeStyle = coul; g.lineWidth = s * 0.14; g.lineCap = 'round';
  g.beginPath(); g.ellipse(0, 0, s * 0.32, s * 0.24, -0.4, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(s * 0.26, -s * 0.06); g.lineTo(s * 0.26, -s * 0.9);
  if (k % 2) { g.moveTo(s * 0.26, -s * 0.9); g.quadraticCurveTo(s * 0.7, -s * 0.7, s * 0.6, -s * 0.35); }
  g.stroke(); g.restore();
}

// ----- ciel et décor de fond d'un monde (écran de jeu et titre) -----
function dessinerCiel(g, W, H, m, seed) {
  const M = MONDES[m], r = rnd(seed || 3);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, M.ciel[0]); gr.addColorStop(0.55, M.ciel[1]); gr.addColorStop(1, M.ciel[2]);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (M.nuit > 0.5) { // étoiles
    for (let i = 0; i < 140; i++) { const a = r(); g.fillStyle = `rgba(255,255,240,${0.3 + a * 0.7})`; g.beginPath(); g.arc(r() * W, r() * H * 0.7, 0.5 + a * 1.4, 0, TAU); g.fill(); }
  }
  // soleil ou lune
  const sx = W * (0.2 + r() * 0.6), sy = H * 0.12, sr = Math.min(W, H) * 0.09;

    </div>`, 'victoire');
  son('fleur');
  if ($('p-suivant')) $('p-suivant').onclick = () => { son('clic'); fermerPop(); fondu(() => { if (dernierDuMonde) ouvrirCarte(n + 1); else chargerNiveau(n + 1); }); };
  $('p-reecouter').onclick = () => { son('clic'); fermerPop(); for (const b of J.budEtat.values()) b.eclos = false; J.eclosion = 0; J.fini = true; lancerConcert(true); setTimeout(() => { if (ecranActuel === 'jeu' && J.concert && J.concert.rejouer) popVictoire(); }, (J.tMax * TEMPO + 3.2) * 1000); };
  $('p-carte').onclick = () => { son('clic'); fermerPop(); fondu(() => ouvrirCarte(n + 1 < NB_NIVEAUX ? n + 1 : n)); };
}
function interrupteur(id, on) { return `<div class="reglage">${id[1]}<div class="interrupteur ${on ? 'on' : ''}" id="r-${id[0]}"></div></div>`; }
function ouvrirReglages() {
  ouvrirPop(`<div class="ruban lav">Réglages</div>
    ${interrupteur(['musique', 'Musique et nature'], reglages.musique)}
    ${interrupteur(['sons', 'Notes et effets'], reglages.sons)}
    ${interrupteur(['vibrations', 'Vibrations'], reglages.vibrations)}
    <div class="boutons" style="margin-top:16px"><button class="btn vert" id="p-ok">Fermer</button></div>
    <p class="credits">Jardin Sonore · musique générée en direct<br>Polices Fredoka et Nunito (licence OFL)</p>`, 'reglages');
  for (const k of ['musique', 'sons', 'vibrations']) $('r-' + k).onclick = e => {
    reglages[k] = !reglages[k]; e.currentTarget.classList.toggle('on', reglages[k]); sauverReglages(); SON.maj();
    if (k === 'musique') SON.musique(reglages.musique, ecranActuel === 'jeu' ? monde() : null);
    son('clic'); if (k === 'vibrations') vibrer('fort');
  };
  $('p-ok').onclick = () => { son('clic'); fermerPop(); };
}
$('voile').addEventListener('pointerdown', e => { if (e.target === $('voile') && popOuverte === 'reglages') fermerPop(); });

// ----- bouton retour Android, mise en pause -----
function retour() {
  if (popOuverte === 'reglages') { fermerPop(); return true; }
  if (popOuverte === 'victoire') { $('p-carte').click(); return true; }
  if (ecranActuel === 'jeu') { if (!(J.concert && !J.fini)) fondu(() => ouvrirCarte(J.n)); return true; }
  if (ecranActuel === 'carte') { fondu(() => montrer('titre')); return true; }
  return false;
}
const AppNative = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (AppNative) AppNative.addListener('backButton', () => { if (!retour()) AppNative.exitApp(); });
document.addEventListener('visibilitychange', () => { SON.pause(document.hidden); });

// ----- boucle principale -----
let tPrec = performance.now();
function boucle(now) {
  const dt = Math.min(0.05, (now - tPrec) / 1000); tPrec = now; tJeu += dt;
  try {
    if (ecranActuel === 'jeu' && J.L) { majParticules(dt); dessinerJeu(dt); }
    else if (ecranActuel === 'carte') dessinerCarte(dt);
    else dessinerTitre(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(boucle);
}
window.addEventListener('resize', redimensionner);
redimensionner();
preparerTitre();
montrer('titre');
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { icones = {}; });
requestAnimationFrame(boucle);

</script>
