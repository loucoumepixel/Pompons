/* Plein écran mobile : un canvas de jeu, des écrans DOM par-dessus (menu, pause, victoire). */
:root{
  --nuit:#2a1250; --nuit2:#4b1d7a; --rose:#ff4f9a; --sucre:#ffd23f; --menthe:#3ee0b4; --ciel:#59c3ff;
  --encre:#24123f; --creme:#fff6e8;
  --f-titre:"Lilita One","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-texte:"Baloo 2","Nunito",system-ui,sans-serif;
  color-scheme:dark;
  --bh:env(safe-area-inset-top,0px);--bd:env(safe-area-inset-right,0px);--bb:env(safe-area-inset-bottom,0px);--bg:env(safe-area-inset-left,0px);
}
/* marges système : env() et variables injectées par l'appli (edge-to-edge) ; max() seulement s'il est connu */
@supports (width:max(1px,2px)){:root{
  --bh:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--bd:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --bb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px))}}
html,body{height:100%;margin:0;background:var(--nuit);color:var(--creme);overflow:hidden;
  font-family:var(--f-texte);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#jeu{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
.ecran{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(16px + var(--bh)) calc(16px + var(--bd)) calc(16px + var(--bb)) calc(16px + var(--bg));box-sizing:border-box;overflow-y:auto;touch-action:pan-y}
.ecran[hidden]{display:none!important}
#accueil{background:
  radial-gradient(120% 70% at 50% 0%, #7b2fbf 0%, transparent 60%),
  radial-gradient(90% 60% at 100% 100%, #ff4f9a55 0%, transparent 60%),
  var(--nuit);justify-content:flex-start}
.logo{font-family:var(--f-titre);font-size:54px;font-size:clamp(46px,13vw,88px);line-height:.9;text-align:center;margin:8px 0 0;
  color:var(--sucre);text-shadow:0 4px 0 #c2541b,0 8px 0 var(--encre),0 10px 24px #0008;letter-spacing:.01em;transform:rotate(-3deg)}
.logo small{display:block;font-size:.42em;color:var(--creme);text-shadow:0 3px 0 var(--encre);margin-top:6px;letter-spacing:.06em}
.sous{margin:0;opacity:.85;text-align:center;max-width:34ch;font-size:16px}
.cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px;width:100%;max-width:640px}
.carte{position:relative;border:0;border-radius:22px;padding:0;overflow:hidden;cursor:pointer;text-align:left;color:var(--creme);
  font-family:inherit;box-shadow:0 6px 0 #0006,0 14px 30px #0006;transition:transform .15s}
.carte:active{transform:translateY(3px) scale(.98)}
.carte:focus-visible,.btn:focus-visible{outline:3px solid var(--sucre);outline-offset:3px}
.carte canvas{display:block;width:100%;height:auto;aspect-ratio:16/10}
.carte .info{padding:12px 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.carte h2{font-family:var(--f-titre);font-weight:400;font-size:26px;margin:0;line-height:1}
.carte p{margin:2px 0 0;font-size:14px;opacity:.9}
.carte .etoiles{font-family:var(--f-titre);font-size:18px;color:var(--sucre);white-space:nowrap}
.c-lance{background:linear-gradient(#3a8ee6,#1d4fa8)}
.c-bonbon{background:linear-gradient(#ff5fa8,#b0237a)}
.bientot{font-size:13px;opacity:.6;text-align:center}
.panneau{background:linear-gradient(#5a2a9a,#3a1670);border-radius:26px;padding:22px 20px;width:100%;max-width:420px;box-sizing:border-box;
  box-shadow:0 8px 0 #1a0838,0 20px 40px #000a;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;border:3px solid #ffffff22}
.panneau h2{font-family:var(--f-titre);font-weight:400;font-size:38px;margin:0;color:var(--sucre);text-shadow:0 3px 0 var(--encre)}
.panneau .msg{margin:0;font-size:17px}
.grosses-etoiles{display:flex;gap:6px;font-size:54px;line-height:1}
.grosses-etoiles span{filter:grayscale(1) brightness(.5);transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.8,.5,1),filter .2s}
.grosses-etoiles span.on{filter:none;transform:scale(1)}
.grosses-etoiles span:nth-child(2){transform:translateY(-12px) scale(.6)}
.grosses-etoiles span.on:nth-child(2){transform:translateY(-12px) scale(1.15)}
.score-final{font-family:var(--f-titre);font-size:30px;font-variant-numeric:tabular-nums}
.rang{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--f-titre);font-size:20px;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;color:var(--encre);
  background:var(--sucre);box-shadow:0 5px 0 #b77d00;min-width:56px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b77d00}
.btn.vert{background:var(--menthe);box-shadow:0 5px 0 #13906f}
.btn.gris{background:#d9cdf0;box-shadow:0 5px 0 #8b7bb0}
.niveaux{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;width:100%}
.niv{aspect-ratio:1;min-height:64px;border:0;border-radius:16px;font-family:var(--f-titre);font-size:26px;color:var(--encre);background:var(--sucre);
  box-shadow:0 5px 0 #b77d00;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px}
.niv small{font-size:11px;letter-spacing:1px;color:#8a4a00}
.niv:disabled{background:#6d5a91;box-shadow:0 5px 0 #3b2a5c;color:#a898c8;cursor:default}
.niv:disabled small{color:#a898c8}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(8px + var(--bh)) calc(10px + var(--bd)) 0 calc(10px + var(--bg));pointer-events:none}
#hud[hidden]{display:none!important}
#hud .btn{pointer-events:auto;font-size:18px;padding:8px 12px;min-width:44px}
#tourne{position:fixed;left:50%;bottom:calc(14px + var(--bb));transform:translateX(-50%);background:#000a;border-radius:20px;
  padding:6px 14px;font-size:14px;pointer-events:none;white-space:nowrap}
/* téléphone en paysage : accueil plus compact pour voir les deux cartes */
@media (max-height:500px) and (min-width:560px){#accueil{gap:10px}.logo{font-size:40px}.sous{font-size:14px;max-width:none}.cartes{grid-template-columns:1fr 1fr;max-width:600px}.carte canvas{height:calc(100vh - 250px);min-height:90px;object-fit:cover}.carte .info{padding:8px 12px 10px}.carte h2{font-size:19px}.carte .etoiles{font-size:15px}.carte p{font-size:12px}}
@media (prefers-reduced-motion:reduce){.logo{transform:none}.grosses-etoiles span{transition:none}}
</style>

<script>
'use strict';
// ===== Commun : canvas, son, sauvegarde, dessin d'Éric, écrans =====
// ----- Compatibilité vieilles WebView Android (Chrome < 99) -----
if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    let t = Array.isArray(r) ? r : [r || 0];
    if (t.length === 1) t = [t[0], t[0], t[0], t[0]]; else if (t.length === 2) t = [t[0], t[1], t[0], t[1]]; else if (t.length === 3) t = [t[0], t[1], t[2], t[1]];
    const m = Math.min(Math.abs(w), Math.abs(h)) / 2, [a, b, c, d] = t.map(v => Math.max(0, Math.min(+v || 0, m)));
    this.moveTo(x + a, y); this.lineTo(x + w - b, y); this.arcTo(x + w, y, x + w, y + b, b);
    this.lineTo(x + w, y + h - c); this.arcTo(x + w, y + h, x + w - c, y + h, c);
    this.lineTo(x + d, y + h); this.arcTo(x, y + h, x, y + h - d, d);
    this.lineTo(x, y + a); this.arcTo(x, y, x + a, y, a); this.closePath();
  };
}
if (!Array.prototype.flat) Object.defineProperty(Array.prototype, 'flat', { configurable: true, writable: true, value: function () { return [].concat.apply([], this); } });
const cv = document.getElementById('jeu');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, BORD = { h: 0, d: 0, b: 0, g: 0 }; // BORD : marges système (haut, droite, bas, gauche)
function redim() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  const sb = document.getElementById('sonde-bords'), st = sb && getComputedStyle(sb), px = v => Math.max(0, parseFloat(v) || 0);
  BORD = st ? { h: px(st.paddingTop), d: px(st.paddingRight), b: px(st.paddingBottom), g: px(st.paddingLeft) } : { h: 0, d: 0, b: 0, g: 0 };
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (jeuCourant && jeuCourant.redim) jeuCourant.redim();
}
window.addEventListener('resize', redim);

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = n => Math.floor(Math.random() * n);

// ----- Sauvegarde (optionnelle) -----
// copie en mémoire : la progression tient la session même si le stockage est bloqué
const Sauve = {
  mem: {},
  lire(k, def) {
    const bon = o => Array.isArray(def) ? Array.isArray(o) : typeof o === typeof def; // valeur abîmée : on l'ignore
    if (k in this.mem) return JSON.parse(this.mem[k]);
    try { const v = localStorage.getItem('pompons.' + k); if (v != null) { const o = JSON.parse(v); if (bon(o)) { this.mem[k] = v; return o; } } } catch (e) { }
    return def;
  },
  ecrire(k, v) { this.mem[k] = JSON.stringify(v); try { localStorage.setItem('pompons.' + k, this.mem[k]); } catch (e) { } }
};

// ----- Son synthétisé -----
const Son = {
  ac: null, actif: Sauve.lire('son', true), maitre: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.maitre = this.ac.createGain(); this.maitre.gain.value = 0.5; this.maitre.connect(this.ac.destination);
      const n = this.ac.sampleRate; this.bruitBuf = this.ac.createBuffer(1, n, n);
      const d = this.bruitBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  ok() { return this.ac && this.actif; },
  ton(f, dur, type = 'sine', vol = 0.3, f2 = null, delai = 0) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + delai, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.maitre); o.start(t); o.stop(t + dur + 0.05);
  },
  bruit(dur, vol = 0.3, freq = 1200, q = 1, type = 'bandpass', delai = 0, f2 = null) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + delai, s = this.ac.createBufferSource(), fl = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.bruitBuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.maitre); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  // Effets nommés
  tension(p) { this.ton(180 + p * 260, 0.06, 'triangle', 0.06); },
  lance() { this.bruit(0.35, 0.35, 700, 0.8, 'bandpass', 0, 2600); this.ton(320, 0.25, 'triangle', 0.15, 900); },
  bois(v) { this.bruit(0.12, 0.25 * v, 500, 2); this.ton(140, 0.1, 'triangle', 0.12 * v, 90); },
  boisCasse() { this.bruit(0.25, 0.35, 900, 1.5); this.ton(110, 0.18, 'square', 0.08, 60); },
  verre(v) { this.ton(2400 + rnd(0, 800), 0.12, 'sine', 0.06 * v); },
  verreCasse() { for (let i = 0; i < 5; i++) this.ton(2000 + rnd(0, 2500), 0.2, 'sine', 0.06, null, i * 0.025); this.bruit(0.25, 0.25, 5000, 1, 'highpass'); },
  pierre(v) { this.bruit(0.14, 0.3 * v, 260, 1.5); },
  pierreCasse() { this.bruit(0.35, 0.4, 300, 0.7); this.ton(80, 0.3, 'sine', 0.2, 40); },
  zombie() { this.ton(140 + rnd(0, 40), 0.35, 'sawtooth', 0.07, 90); },
  pouf() { this.bruit(0.3, 0.3, 1500, 0.5, 'lowpass', 0, 200); this.ton(500, 0.25, 'square', 0.06, 150); },
  boum() { this.bruit(0.8, 0.7, 900, 0.5, 'lowpass', 0, 60); this.ton(90, 0.6, 'sine', 0.4, 30); },
  turbo() { this.ton(300, 0.3, 'sawtooth', 0.12, 1400); this.bruit(0.3, 0.2, 2000, 1, 'bandpass', 0, 5000); },
  triple() { [660, 880, 990].forEach((f, i) => this.ton(f, 0.12, 'square', 0.07, null, i * 0.05)); },
  cri() { this.ton(700, 0.25, 'square', 0.06, 1100); },
  etoile(i) { this.ton(660 * Math.pow(1.26, i), 0.35, 'triangle', 0.18); this.ton(1320 * Math.pow(1.26, i), 0.3, 'sine', 0.06, null, 0.05); },
  victoire() { [523, 659, 784, 1046].forEach((f, i) => this.ton(f, 0.3, 'triangle', 0.18, null, i * 0.11)); },
  defaite() { [392, 330, 262].forEach((f, i) => this.ton(f, 0.35, 'triangle', 0.15, null, i * 0.18)); },
  // Bonbons
  echange() { this.ton(520, 0.08, 'sine', 0.12, 700); },
  refus() { this.ton(220, 0.12, 'square', 0.06, 160); },
  croque(n) { const f = 520 * Math.pow(1.122, Math.min(n, 12)); this.ton(f, 0.16, 'triangle', 0.16); this.ton(f * 2, 0.1, 'sine', 0.05, null, 0.02); this.bruit(0.06, 0.12, 4000, 2); },

// ----- Dessin d'un Pompon -----
// Une boule de poils ronde aux grands yeux. opts : chapeau 'casque'|'toque'|null, couleur, bande,
// expr 'calme'|'cri'|'aie'|'joie'|'clin', regard (angle), angle

  const expr = opts.expr || 'calme';

    c.strokeStyle = contour; c.lineWidth = 3; c.beginPath(); c.moveTo(-60, -34); c.lineTo(60, -34); c.moveTo(-60, -21); c.lineTo(60, -21); c.stroke();

    c.beginPath(); c.ellipse(ex, ey, 12, 15, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    const pr = expr === 'cri' ? 4 : 7;
    c.fillStyle = '#1b1320'; c.beginPath(); c.arc(ex + rx, ey + ry + 2, pr, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + rx - 2.5, ey + ry - 1, pr * 0.35, 0, Math.PI * 2); c.fill();
  });

  if (expr === 'cri') { c.strokeStyle = contour; c.lineWidth = 4.5; c.beginPath(); c.moveTo(-26, -24); c.lineTo(-8, -18); c.moveTo(26, -24); c.lineTo(8, -18); c.stroke(); }

  // toque de chef
  if (opts.chapeau === 'toque') {
    c.fillStyle = '#fff'; c.strokeStyle = contour; c.lineWidth = 4;

    c.fillStyle = '#ffe1ee'; c.beginPath(); c.rect(-33, -46, 66, 10); c.fill(); c.stroke();
  }
  c.restore();
}

      const k = p.t / 1.1; c.globalAlpha = 1 - k * k;
      c.font = `${Math.round(cs * 0.42)}px "Lilita One", system-ui, sans-serif`;
      c.lineWidth = 4; c.strokeStyle = '#4a1050'; const x = bx + p.x * cs, y = by + p.y * cs - k * cs * 0.8;
      c.strokeText(p.n.toLocaleString('fr-FR'), x, y); c.fillStyle = p.coul; c.fillText(p.n.toLocaleString('fr-FR'), x, y);
    }
    c.globalAlpha = 1;
    c.restore();
    // bannière d'intro
    if (phase === 'entree' || (phase === 'jeu' && tPhase < 1.2 && coups === niv.coups)) {
      const a = phase === 'entree' ? 1 : 1 - tPhase / 1.2;
      c.globalAlpha = a; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = `${Math.min(46, W / 11)}px "Lilita One", system-ui, sans-serif`; c.lineWidth = 8; c.strokeStyle = '#4a1050';
      const y = by + R * cs / 2, mx = (panneau.paysage ? bx + C * cs / 2 : panneau.x + panneau.w / 2), tw = c.measureText(niv.nom).width + 40;
      c.fillStyle = 'rgba(74,16,80,.8)'; c.beginPath(); c.roundRect(mx - tw / 2, y - 34, tw, 68, 20); c.fill();
      c.strokeText(niv.nom, (panneau.paysage ? bx + C * cs / 2 : panneau.x + panneau.w / 2), y); c.fillStyle = '#ffd23f'; c.fillText(niv.nom, (panneau.paysage ? bx + C * cs / 2 : panneau.x + panneau.w / 2), y);
      c.globalAlpha = 1;
    }
    if (N === 0 && phase === 'jeu' && coups === niv.coups && tPhase > 1.2) {
      c.textAlign = 'center'; c.textBaseline = 'top'; c.font = '17px "Baloo 2", system-ui, sans-serif'; c.fillStyle = '#fff';
      // aide découpée en lignes ; en paysage, posée sur le bas du plateau avec un fond
      const larg = panneau.paysage ? C * cs - 16 : panneau.w, mots = 'Glisse un bonbon vers son voisin pour aligner 3 bonbons pareils'.split(' '), lignes = [''];
      for (const m of mots) { const l = lignes[lignes.length - 1], e = l ? l + ' ' + m : m; if (l && c.measureText(e).width > larg) lignes.push(m); else lignes[lignes.length - 1] = e; }
      const mx = panneau.paysage ? bx + C * cs / 2 : panneau.x + panneau.w / 2, hl = lignes.length * 20;
      const y0 = panneau.paysage ? by + R * cs - hl - 12 : Math.min(H - BORD.b - hl - 8, by + R * cs + 10);
      if (panneau.paysage) { c.fillStyle = 'rgba(42,18,80,.8)'; c.beginPath(); c.roundRect(bx + 4, y0 - 6, C * cs - 8, hl + 10, 12); c.fill(); c.fillStyle = '#fff'; }
      lignes.forEach((l, i) => c.fillText(l, mx, y0 + i * 20));
    }
  }

  return { titre: 'Pompon Pâtissier', niveaux, demarrer, arreter, maj, dessiner, pointeur, redim, rendreBonbon,
    debug: () => ({ phase, coups, score, bx, by, cs, indice: coupPossible(), fini, R, C, collecte, gelee: gelee.map(l => l.slice()),
      grille: grille.map(l => l.map(p => p && { t: p.t, sp: p.sp })), alignes: trouverAlignements().length, pieces: grille.flat().filter(p => p).length }) };
})();

  c.lineCap = 'round'; c.strokeStyle = '#5a3416'; c.lineWidth = 10; c.beginPath(); c.moveTo(70, 252); c.lineTo(70, 200); c.lineTo(58, 172); c.moveTo(70, 200); c.lineTo(84, 172); c.stroke();
  dessinerLouc(c, 330, 120, 30, { chapeau: 'casque', couleur: '#e8433a', bande: '#fff3d6', expr: 'cri', angle: 0.3, regard: 0.2 });
  // Pompon Pâtissier : grille de bonbons

  motif.forEach((l, r) => l.forEach((v, k) => {
    c.fillStyle = (r + k) % 2 ? 'rgba(40,10,70,.55)' : 'rgba(60,20,95,.55)'; c.fillRect(ox + k * cs, oy + r * cs, cs, cs);
    let t = v, sp = null; if (v === 'b') { t = 0; sp = 'bombe'; } if (v === 'h') { t = 2; sp = 'h'; } if (v === 'v') { t = 4; sp = 'v'; } if (v === 'e') { t = 5; sp = 'emb'; }
