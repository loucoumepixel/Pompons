:root { --rose: #f07fae; --rose-f: #d0558d; --texte: #8a4a6c; --lav: #8566dd; --menthe: #36ad80; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe6f0; font-family: 'Baloo 2', sans-serif; color: var(--texte); touch-action: none; overscroll-behavior: none; }
#jeu { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#sonde-bords { position: fixed; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.ecran { position: fixed; inset: 0; display: none; }
.ecran.on { display: block; }
button { font-family: 'Lilita One', sans-serif; border: 0; cursor: pointer; color: #fff; }
.btn { font-size: 24px; padding: 12px 34px 14px; border-radius: 999px; background: linear-gradient(#ffa3c8, #f0679f); box-shadow: 0 5px 0 #c94a85, 0 10px 18px rgba(200,70,130,.3); text-shadow: 0 2px 0 rgba(170,40,100,.35); transition: transform .08s; letter-spacing: .5px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c94a85, 0 5px 10px rgba(200,70,130,.3); }
.btn.vert { background: linear-gradient(#8fe6bd, #3fbf8a); box-shadow: 0 5px 0 #2a9a6c, 0 10px 18px rgba(50,160,110,.3); text-shadow: 0 2px 0 rgba(30,120,80,.35); }
.btn.lav { background: linear-gradient(#cdb8ff, #9575ee); box-shadow: 0 5px 0 #7457cc, 0 10px 18px rgba(120,90,210,.3); text-shadow: 0 2px 0 rgba(90,60,170,.35); }
.btn.petit { font-size: 18px; padding: 9px 22px 11px; }
.rond { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 4px 12px rgba(150,70,120,.2); display: grid; place-items: center; }
.rond svg { width: 26px; height: 26px; }

/* titre */
#titre { background: center/cover; text-align: center; }
#titre .contenu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
.logo { font-family: 'Lilita One', sans-serif; font-size: clamp(54px, 17vw, 96px); line-height: .9; margin: 0; }
.logo span { display: inline-block; -webkit-text-stroke: 10px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(255,255,255,.6), 0 12px 24px rgba(200,90,150,.35); animation: lettre 3.2s ease-in-out infinite; }
@keyframes lettre { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
.sous-titre { font-weight: 700; font-size: 18px; color: #b0628b; margin-top: -6px; background: rgba(255,255,255,.7); padding: 2px 14px; border-radius: 99px; }
#mochi-titre { width: min(46vw, 210px); animation: rebond 1.6s ease-in-out infinite; filter: drop-shadow(0 10px 12px rgba(160,80,130,.25)); }
@keyframes rebond { 0%,100% { transform: translateY(0) scale(1,1) } 45% { transform: translateY(-16px) scale(.97,1.03) } 55% { transform: translateY(-16px) scale(.97,1.03) } 90% { transform: translateY(0) scale(1.06,.94) } }
.flotte { position: absolute; width: 54px; animation: flotte 7s ease-in-out infinite; opacity: .95; pointer-events: none; }
@keyframes flotte { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-22px) rotate(8deg) } }
#titre .coin { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 14px; }

/* carte */
#carte { background: #ffd9e8; }
#carte .defile { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#carte .monde { position: relative; background-size: 100% 100%; }
#carte .banniere { position: absolute; left: 50%; transform: translateX(-50%); top: 26px; white-space: nowrap; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #fff; padding: 8px 26px 10px; border-radius: 18px; box-shadow: 0 6px 16px rgba(120,60,110,.25); }
#carte .banniere small { display: block; font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; opacity: .9; margin-top: -4px; text-align: center; }
#carte svg.chemin { position: absolute; inset: 0; pointer-events: none; }
.noeud { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; font-family: 'Lilita One'; font-size: 24px; display: grid; place-items: center; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
.noeud.fait { background: radial-gradient(circle at 35% 30%, #fff 0 6%, transparent 7%), linear-gradient(#ffa3c8, #f0679f); box-shadow: 0 4px 0 #c94a85, 0 8px 14px rgba(200,70,130,.3); border: 3px solid #fff; }
.noeud.actuel { background: radial-gradient(circle at 35% 30%, #fff 0 6%, transparent 7%), linear-gradient(#8fe6bd, #3fbf8a); box-shadow: 0 4px 0 #2a9a6c, 0 0 0 8px rgba(255,255,255,.55), 0 8px 18px rgba(50,160,110,.35); border: 3px solid #fff; width: 70px; height: 70px; margin: -35px 0 0 -35px; font-size: 28px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
.noeud.ferme { background: rgba(255,255,255,.65); color: rgba(150,100,130,.6); text-shadow: none; border: 3px solid rgba(255,255,255,.8); }
.noeud .etoiles { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); display: flex; gap: 0; }
.noeud.actuel .etoiles { top: 62px; }
.noeud .etoiles i { width: 18px; height: 18px; background: center/contain no-repeat; display: block; }
.noeud .etoiles i:nth-child(2) { margin-top: 4px; }
.avatar { position: absolute; width: 58px; margin: -100px 0 0 -29px; animation: rebond 1.6s ease-in-out infinite; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(120,60,110,.25)); }
#carte .haut { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#carte .haut > * { pointer-events: auto; }
.total { background: rgba(255,255,255,.92); border-radius: 99px; padding: 6px 16px 6px 8px; font-family: 'Lilita One'; font-size: 20px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(150,70,120,.2); }
.total img { width: 30px; }

/* fenêtres */
#voile { position: fixed; inset: 0; background: rgba(120,60,100,.35); display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
#voile.on { display: flex; }
.carte-pop { position: relative; width: min(100%, 380px); background: linear-gradient(#fff, #fff6fa); border-radius: 30px; padding: 46px 22px 24px; text-align: center; box-shadow: 0 20px 50px rgba(120,50,100,.35); animation: entre .32s cubic-bezier(.2,1.4,.4,1); border: 4px solid #fff; }
@keyframes entre { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.ruban { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-family: 'Lilita One'; font-size: 26px; color: #fff; padding: 8px 30px 10px; border-radius: 16px; background: linear-gradient(#ffa3c8, #f0679f); box-shadow: 0 6px 0 #c94a85; white-space: nowrap; }
.ruban.vert { background: linear-gradient(#8fe6bd, #3fbf8a); box-shadow: 0 6px 0 #2a9a6c; }
.ruban.lav { background: linear-gradient(#cdb8ff, #9575ee); box-shadow: 0 6px 0 #7457cc; }
.objs { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 16px; }
.obj { display: flex; align-items: center; gap: 12px; background: #fff0f6; border-radius: 18px; padding: 8px 14px; text-align: left; font-weight: 700; font-size: 17px; line-height: 1.15; }
.obj img { width: 44px; height: 44px; flex: none; }
.obj.ok { background: #e3f8ee; color: #2a8c62; }
.infos { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
.pastille { background: #f4edff; color: var(--lav); border-radius: 99px; padding: 4px 14px; font-weight: 800; font-size: 16px; }
.nouveau { background: #fff7d6; color: #a07a12; border-radius: 16px; padding: 8px 12px; font-weight: 700; font-size: 15px; margin: -4px 0 14px; }
.boutons { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.ligne-btn { display: flex; gap: 12px; justify-content: center; }
.grandes-etoiles { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
.grandes-etoiles img { width: 70px; opacity: .25; filter: grayscale(1); }
.grandes-etoiles img:nth-child(2) { width: 86px; margin-top: -14px; }
.grandes-etoiles img.on { opacity: 1; filter: none; animation: etoile .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes etoile { from { transform: scale(0) rotate(-90deg) } to { transform: scale(1) rotate(0) } }
.score-fin { font-family: 'Lilita One'; font-size: 34px; color: var(--rose-f); }
.record { color: #e0a92b; font-weight: 800; font-size: 15px; height: 20px; }
.reglage { display: flex; justify-content: space-between; align-items: center; background: #fff0f6; border-radius: 18px; padding: 10px 16px; font-weight: 800; font-size: 18px; margin-bottom: 10px; }
.interrupteur { width: 58px; height: 32px; border-radius: 99px; background: #e8d6e0; position: relative; transition: background .2s; }
.interrupteur::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.15); transition: left .2s; }
.interrupteur.on { background: #3fbf8a; }
.interrupteur.on::after { left: 30px; }
.mochi-pop { width: 90px; margin: -8px auto 2px; display: block; }
.credits { font-size: 13px; opacity: .7; margin-top: 12px; }
</style>
</head>

  carre7: ['#######', '#######', '#######', '#######', '#######', '#######', '#######'],
  carre8: ['########', '########', '########', '########', '########', '########', '########', '########'],
  plein: ['#########', '#########', '#########', '#########', '#########', '#########', '#########', '#########', '#########'],
  coeur: ['.##...##.', '####.####', '#########', '#########', '#########', '.#######.', '..#####..', '...###...', '....#....'],
  diamant: ['...###...', '..#####..', '.#######.', '#########', '#########', '#########', '.#######.', '..#####..', '...###...'],
  sablier: ['#########', '#########', '.#######.', '..#####..', '...###...', '..#####..', '.#######.', '#########', '#########'],
  croix: ['..#####..', '..#####..', '#########', '#########', '#########', '#########', '#########', '..#####..', '..#####..'],
  anneau: ['#########', '#########', '#########', '###...###', '###...###', '###...###', '#########', '#########', '#########'],
  colonnes: ['###.#.###', '###.#.###', '#########', '#########', '#########', '#########', '#########', '###.#.###', '###.#.###'],
  fleur: ['..##.##..', '.#######.', '#########', '#########', '####.####', '#########', '#########', '.#######.', '..##.##..'],
  tasse: ['#########', '#########', '#########', '#########', '#########', '.#######.', '.#######.', '..#####..', '...###...'],
  nuage: ['..##.##..', '.#######.', '#########', '#########', '#########', '#########', '#########', '#########', '.#######.'],
  marches: ['####.....', '#####....', '######...', '#######..', '########.', '#########', '#########', '#########', '#########'],
  papillon: ['##.....##', '###...###', '####.####', '#########', '#########', '#########', '####.####', '###...###', '##.....##'],
  tour: ['.#######.', '.#######.', '#########', '#########', '#########', '#########', '#########', '.#######.', '.#######.'],
};
const ORDRE_FORMES = ['carre7', 'carre8', 'plein', 'coeur', 'diamant', 'croix', 'nuage', 'tour', 'sablier', 'fleur', 'anneau', 'tasse', 'colonnes', 'papillon', 'marches'];

function aleaNiv(s) { s = (s * 2654435761) >>> 0; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

// Mécaniques par niveau : progression douce, on introduit une chose à la fois.
function recette(i) {
  const m = Math.floor(i / PAR_MONDE), j = i % PAR_MONDE;
  if (m === 0) {
    if (j < 3) return ['score'];
    if (j < 6) return ['couleur'];
    if (j < 10) return j === 9 ? ['creme', 'couleur'] : ['creme'];
    if (j < 14) return j === 13 ? ['glace', 'creme'] : ['glace'];
    if (j < 18) return ['cerise'];
    return j === 18 ? ['cerise', 'creme'] : ['couleur', 'glace'];
  }
  if (m === 1 && j < 3) return ['verrou', j === 2 ? 'couleur' : 'score'];
  const cycle = [
    ['creme'], ['couleur', 'verrou'], ['glace'], ['cerise'], ['score'],
    ['creme', 'verrou'], ['glace', 'couleur'], ['cerise', 'creme'], ['couleur'], ['creme', 'glace'],
    ['cerise', 'verrou'], ['glace', 'verrou'], ['couleur', 'creme'], ['cerise', 'glace'], ['score', 'verrou'],
    ['creme'], ['couleur', 'cerise'], ['glace', 'creme', 'verrou'], ['cerise'], ['creme', 'couleur', 'glace'],
  ];
  return cycle[(j + m * 3) % cycle.length];
}

function genererNiveau(i, facile) {
  const cal = (typeof CALIB !== 'undefined' && CALIB[i]) || null;
  if (facile == null) facile = cal ? cal[4] | 0 : 0;
  const rnd = aleaNiv(i + 101), m = Math.floor(i / PAR_MONDE), j = i % PAR_MONDE;
  let types = recette(i);
  if (facile >= 3 && types.length > 1) types = types.slice(0, 1);
  let forme;
  if (i < 3) forme = ['carre7', 'carre8', 'plein'][i];
  else if (m === 0) forme = ORDRE_FORMES[(j * 3) % 8];
  else forme = ORDRE_FORMES[(j * 7 + m * 5) % ORDRE_FORMES.length];
  const F = FORMES[forme], R = F.length, C = F[0].length;
  const M = f => Array.from({ length: R }, (_, r) => Array.from({ length: C }, (_, c) => f(r, c)));
  const ok = M((r, c) => F[r][c] === '#' ? 1 : 0);
  const ice = M(() => 0), lock = M(() => 0), cream = M(() => 0);
  const sym = (r, c, f) => { f(r, c); f(r, C - 1 - c); };
  const okc = (r, c) => r >= 0 && c >= 0 && r < R && c < C && ok[r][c];
  // couleurs : 5 en général, 4 pour les niveaux « respiration », 6 pour quelques défis tardifs
  let colors = 5;
  if (i < 6 || j % 5 === 4) colors = 4;
  if (m >= 3 && j % 6 === 5) colors = 6;
  if (facile >= 1) colors = Math.min(colors, 5);
  if (facile >= 2) colors = 4;
  const dif = Math.min(1, m / 5 + j / 60); // 0 → 1

  if (types.includes('creme')) {
    const motif = (i * 5 + m) % (m < 2 ? 4 : 5);
    const double = !facile && m >= 2 && rnd() < 0.2 + dif * 0.3 ? 2 : 1;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (ok[r][c]) {
      let v = 0;
      if (motif === 0) v = r >= R - 3;
      else if (motif === 1) v = Math.abs(r - (R - 1) / 2) + Math.abs(c - (C - 1) / 2) <= 2.5;
      else if (motif === 2) v = (r + c) % 2 === 0;
      else if (motif === 3) v = r === 0 || c === 0 || r === R - 1 || c === C - 1 || !okc(r - 1, c) || !okc(r + 1, c) || !okc(r, c - 1) || !okc(r, c + 1);
      else v = 1;
      if (v) cream[r][c] = double && (r + c) % 3 === 0 ? double : 1;
    }
  }
  if (types.includes('glace')) {
    const hp = !facile && m >= 1 && rnd() < 0.3 + dif * 0.4 ? 2 : 1;
    const motif = (i * 3 + m) % 4;
    for (let r = 1; r < R - 1; r++) for (let c = 0; c < C; c++) if (ok[r][c]) {
      let v = 0;
      if (motif === 0) v = (r === Math.floor(R / 2)) && c % 2 === 1;
      else if (motif === 1) v = (r >= R - 3) && (c === 0 || c === C - 1 || c === Math.floor(C / 2));
      else if (motif === 2) v = Math.abs(r - Math.floor(R / 2)) <= 1 && Math.abs(c - Math.floor(C / 2)) <= 1;
      else v = (r === 2 || r === R - 3) && (c % 3 === 1);
      if (v) ice[r][c] = hp;
    }
    // si le motif tombe dans un trou de la forme, on pose des piliers de glaçage
    if (!ice.some(l => l.some(v => v))) for (let r = 2; r < R - 1; r += 3) for (let c = 1; c < C - 1; c += 3) if (ok[r][c]) ice[r][c] = hp;
    if (!ice.some(l => l.some(v => v))) types = types.filter(t => t !== 'glace');
  }
  if (types.includes('verrou')) {
    const n = 4 + Math.floor(dif * 6);
    for (let k = 0; k < n; k++) {
      const r = 1 + Math.floor(rnd() * (R - 2)), c = Math.floor(rnd() * Math.ceil(C / 2));
      sym(r, c, (a, b) => { if (ok[a][b] && !ice[a][b]) lock[a][b] = 1; });
    }
  }
  const goals = [];
  for (const t of types) {
    if (t === 'creme') goals.push({ type: 'creme' });
    else if (t === 'glace') goals.push({ type: 'glace' });
    else if (t === 'cerise') goals.push({ type: 'cerise', n: Math.min(3, 1 + Math.floor((j + m * 2) / 8)) });
    else if (t === 'couleur') {
      const nb = types.length > 1 || dif < 0.3 ? 1 : 2;
      const t0 = Math.floor(rnd() * colors);
      for (let k = 0; k < nb; k++) goals.push({ type: 'couleur', t: (t0 + k * 2) % colors, n: Math.round((15 + dif * 20 - (colors === 6 ? 5 : 0)) / 5) * 5 });
    } else if (t === 'score') goals.push({ type: 'score', n: 0 });
  }
  // les verrous seuls ne font pas un objectif : ils gênent, c'est tout
  if (!goals.length) goals.push({ type: 'score', n: 0 });
  const niv = { i, facile, monde: m, forme, rows: R, cols: C, ok, ice, lock, cream, colors, goals, moves: cal ? cal[0] : 30, stars: cal ? [0, cal[1], cal[2]] : [0, 1e9, 1e9] };
  for (const g of goals) if (g.type === 'score') g.n = cal ? cal[3] : 3000;
  return niv;
}

if (false) module.exports = { genererNiveau, MONDES, PAR_MONDE, NB_NIVEAUX, FORMES };

'use strict';
// ===== Dessins : bonbons, cases, décors, mascotte Mochi =====
const COUL = [
  { b: '#ff9ec4', d: '#e0679a', l: '#ffd6e7', nom: 'macaron' },
  { b: '#ffad7a', d: '#e27f45', l: '#ffdcc4', nom: 'coeur' },
  { b: '#ffdc5e', d: '#dcae17', l: '#fff3b8', nom: 'etoile' },
  { b: '#79dcb0', d: '#36ad80', l: '#cbf5e2', nom: 'goutte' },
  { b: '#86c5ff', d: '#4a8fd8', l: '#d4ecff', nom: 'cube' },
  { b: '#c0a2ff', d: '#8566dd', l: '#e8ddff', nom: 'gemme' },
];
const ARC_COUL = ['#ff8fb8', '#ffb07c', '#ffd95e', '#79dcb0', '#86c5ff', '#c0a2ff'];

function toile(w, h) {
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

// ----- formes des bonbons (centrées sur 0,0, rayon r) -----
function cheminForme(g, t, r) {
  g.beginPath();
  if (t === 0) { // macaron : ellipse large
    g.ellipse(0, 0, r * 0.98, r * 0.82, 0, 0, Math.PI * 2);
  } else if (t === 1) { // coeur
    const s = r * 1.02;
    g.moveTo(0, s * 0.86);
    g.bezierCurveTo(-s * 0.15, s * 0.72, -s * 1.02, s * 0.2, -s * 0.98, -s * 0.28);
    g.bezierCurveTo(-s * 0.95, -s * 0.78, -s * 0.32, -s * 0.98, 0, -s * 0.5);
    g.bezierCurveTo(s * 0.32, -s * 0.98, s * 0.95, -s * 0.78, s * 0.98, -s * 0.28);
    g.bezierCurveTo(s * 1.02, s * 0.2, s * 0.15, s * 0.72, 0, s * 0.86);
  } else if (t === 2) { // étoile arrondie
    const n = 5, R1 = r * 1.06, R2 = r * 0.58;
    for (let k = 0; k <= n * 2; k++) {
      const a = -Math.PI / 2 + k * Math.PI / n, R = k % 2 ? R2 : R1;
      const x = Math.cos(a) * R, y = Math.sin(a) * R + r * 0.06;
      if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
  } else if (t === 3) { // goutte
    g.moveTo(0, -r * 1.02);
    g.bezierCurveTo(r * 0.35, -r * 0.55, r * 0.92, -r * 0.05, r * 0.88, r * 0.32);
    g.bezierCurveTo(r * 0.84, r * 0.82, r * 0.42, r * 0.98, 0, r * 0.98);
    g.bezierCurveTo(-r * 0.42, r * 0.98, -r * 0.84, r * 0.82, -r * 0.88, r * 0.32);
    g.bezierCurveTo(-r * 0.92, -r * 0.05, -r * 0.35, -r * 0.55, 0, -r * 1.02);
  } else if (t === 4) { // cube de sucre
    g.roundRect(-r * 0.86, -r * 0.86, r * 1.72, r * 1.72, r * 0.38);
  } else if (t === 5) { // gemme
    g.moveTo(0, -r * 1.0); g.lineTo(r * 0.95, -r * 0.1); g.lineTo(0, r * 1.0); g.lineTo(-r * 0.95, -r * 0.1); g.closePath();
  } else { // rond (mochi, cerise)
    g.arc(0, 0, r * 0.95, 0, Math.PI * 2);
  }
}

function visage(g, r, y, couleurOeil, joie) {
  const ex = r * 0.27, ey = y, er = r * 0.085;
  g.fillStyle = couleurOeil || '#5a3346';
  if (joie) {
    g.lineWidth = r * 0.07; g.lineCap = 'round'; g.strokeStyle = couleurOeil || '#5a3346';
    for (const s of [-1, 1]) { g.beginPath(); g.arc(s * ex, ey + er * 0.6, er * 1.1, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  } else {
    for (const s of [-1, 1]) {
      g.beginPath(); g.ellipse(s * ex, ey, er, er * 1.25, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(s * ex - er * 0.3, ey - er * 0.45, er * 0.42, 0, Math.PI * 2); g.fill();
      g.fillStyle = couleurOeil || '#5a3346';
    }
  }
  g.strokeStyle = couleurOeil || '#5a3346'; g.lineWidth = r * 0.06; g.lineCap = 'round';
  g.beginPath(); g.arc(0, ey + r * 0.1, r * 0.1, Math.PI * 0.15, Math.PI * 0.85); g.stroke();
  g.fillStyle = 'rgba(255,120,150,0.35)';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * r * 0.46, ey + r * 0.16, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); g.fill(); }
}

function corpsBonbon(g, t, r) {
  const P = COUL[t];
  // ombre douce
  g.save();
  g.shadowColor = 'rgba(90,50,80,0.28)'; g.shadowBlur = r * 0.22; g.shadowOffsetY = r * 0.12;
  cheminForme(g, t, r);
  if (t === 2) { g.lineJoin = 'round'; g.lineWidth = r * 0.3; g.strokeStyle = P.b; g.stroke(); }
  g.fillStyle = P.b; g.fill();
  g.restore();
  // dégradé de volume
  const gr = g.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.1, 0, 0, r * 1.25);
  gr.addColorStop(0, P.l); gr.addColorStop(0.45, P.b); gr.addColorStop(1, P.d);
  cheminForme(g, t, r);
  if (t === 2) { g.lineJoin = 'round'; g.lineWidth = r * 0.3; g.strokeStyle = gr; g.stroke(); }
  g.fillStyle = gr; g.fill();
  // détails propres à chaque bonbon
  g.save(); cheminForme(g, t, r); g.clip();
  if (t === 0) { // garniture du macaron
    g.fillStyle = '#fff6f9'; g.beginPath(); g.roundRect(-r * 1.1, r * 0.02, r * 2.2, r * 0.2, r * 0.1); g.fill();
    g.fillStyle = 'rgba(224,103,154,0.35)'; g.fillRect(-r * 1.1, r * 0.2, r * 2.2, r * 0.05);
    g.fillStyle = P.d; g.globalAlpha = 0.25;
    for (let k = -4; k <= 4; k++) { g.beginPath(); g.arc(k * r * 0.23, r * 0.0, r * 0.07, 0, Math.PI * 2); g.fill(); }
    g.globalAlpha = 1;
  } else if (t === 4) { // cristaux de sucre
    g.fillStyle = 'rgba(255,255,255,0.75)';
    for (const [x, y, s] of [[-0.5, 0.45, 0.07], [0.48, 0.5, 0.06], [0.55, -0.3, 0.05], [-0.2, 0.62, 0.05], [0.15, 0.38, 0.04]]) { g.beginPath(); g.arc(x * r, y * r, s * r, 0, Math.PI * 2); g.fill(); }
  } else if (t === 5) { // facettes
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.beginPath(); g.moveTo(0, -r); g.lineTo(r * 0.95, -r * 0.1); g.lineTo(0, -r * 0.1); g.closePath(); g.fill();
    g.fillStyle = 'rgba(80,40,140,0.16)';
    g.beginPath(); g.moveTo(0, r); g.lineTo(-r * 0.95, -r * 0.1); g.lineTo(0, -r * 0.1); g.closePath(); g.fill();
  }
  g.restore();
  // contour
  cheminForme(g, t, r);
  g.lineJoin = 'round'; g.lineWidth = Math.max(1, r * 0.075); g.strokeStyle = P.d;
  if (t === 2) { g.save(); g.lineWidth = r * 0.3 + r * 0.075 * 2; g.globalCompositeOperation = 'destination-over'; g.strokeStyle = P.d; g.stroke(); g.restore(); }
  else g.stroke();
  // reflets
  g.fillStyle = 'rgba(255,255,255,0.65)';
  g.beginPath(); g.ellipse(-r * 0.36, -r * 0.42, r * 0.24, r * 0.13, -0.6, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.85)';
  g.beginPath(); g.arc(-r * 0.08, -r * 0.55, r * 0.06, 0, Math.PI * 2); g.fill();
}

function dessinerMochi(g, r, humeur, arcEnCiel) {
  // mascotte : une boule de mochi toute douce
  g.save();
  g.shadowColor = 'rgba(90,50,80,0.25)'; g.shadowBlur = r * 0.25; g.shadowOffsetY = r * 0.12;
  g.beginPath(); g.ellipse(0, r * 0.05, r * 0.98, r * 0.9, 0, 0, Math.PI * 2);
  g.fillStyle = '#fff'; g.fill(); g.restore();
  const gr = g.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.6, '#fff4f8'); gr.addColorStop(1, '#f6d3e2');
  g.beginPath(); g.ellipse(0, r * 0.05, r * 0.98, r * 0.9, 0, 0, Math.PI * 2); g.fillStyle = gr; g.fill();
  g.lineWidth = r * 0.06; g.strokeStyle = '#e8b5ca'; g.stroke();
  if (arcEnCiel) {
    g.save(); g.beginPath(); g.ellipse(0, r * 0.05, r * 0.98, r * 0.9, 0, 0, Math.PI * 2); g.clip();
    let s = 7;
    const al = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let k = 0; k < 26; k++) {
      const a = al() * Math.PI * 2, d = Math.sqrt(al()) * r * 0.92, x = Math.cos(a) * d, y = Math.sin(a) * d;
      if (Math.abs(y - r * 0.08) < r * 0.3 && Math.abs(x) < r * 0.55) continue; // laisse le visage libre
      g.save(); g.translate(x, y); g.rotate(al() * Math.PI);
      g.fillStyle = ARC_COUL[k % 6]; g.beginPath(); g.roundRect(-r * 0.13, -r * 0.045, r * 0.26, r * 0.09, r * 0.045); g.fill();
      g.restore();
    }
    g.restore();
  } else {
    // petite feuille de cerisier sur la tête
    g.save(); g.translate(r * 0.1, -r * 0.83); g.rotate(-0.4);
    g.fillStyle = '#ff9ec4'; g.beginPath(); g.ellipse(0, 0, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#e0679a'; g.lineWidth = r * 0.04; g.stroke();
    g.restore();
  }
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(-r * 0.4, -r * 0.45, r * 0.2, r * 0.11, -0.6, 0, Math.PI * 2); g.fill();
  if (humeur === 'surpris') {
    visage(g, r, r * 0.05, '#5a3346', false);
    g.fillStyle = '#5a3346'; g.beginPath(); g.ellipse(0, r * 0.28, r * 0.08, r * 0.1, 0, 0, Math.PI * 2); g.fill();
  } else visage(g, r, r * 0.05, '#5a3346', humeur === 'joie');
}

function dessinerCerise(g, r) {
  g.save();
  g.strokeStyle = '#6b8f3a'; g.lineWidth = r * 0.11; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -r * 0.35); g.quadraticCurveTo(r * 0.05, -r * 0.85, r * 0.35, -r * 1.0); g.stroke();
  g.fillStyle = '#8fd16a'; g.beginPath(); g.ellipse(r * 0.52, -r * 0.88, r * 0.3, r * 0.14, -0.5, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#5f9a3d'; g.lineWidth = r * 0.04; g.stroke();
  g.restore();
  g.save(); g.translate(0, r * 0.15);
  g.shadowColor = 'rgba(120,20,50,0.3)'; g.shadowBlur = r * 0.2; g.shadowOffsetY = r * 0.1;
  const gr = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  gr.addColorStop(0, '#ffc2cf'); gr.addColorStop(0.45, '#ff5d84'); gr.addColorStop(1, '#d63462');
  g.beginPath(); g.arc(0, 0, r * 0.78, 0, Math.PI * 2); g.fillStyle = gr; g.fill();
  g.shadowColor = 'transparent';
  g.lineWidth = r * 0.07; g.strokeStyle = '#b8264f'; g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.75)'; g.beginPath(); g.ellipse(-r * 0.3, -r * 0.32, r * 0.18, r * 0.1, -0.6, 0, Math.PI * 2); g.fill();
  visage(g, r * 0.78, r * 0.05, '#5a1a30', false);
  g.restore();
}

// Bonbon complet (avec pouvoir) dans une toile de côté S
function spriteBonbon(t, sp, S) {
  const c = toile(S, S), g = c.getContext('2d'); g.translate(S / 2, S / 2);
  const r = S * 0.4;
  if (t === 9) { dessinerCerise(g, r); return c; }
  if (sp === SP.ARC || t === 6) { dessinerMochi(g, r * 1.02, 'joie', true); return c; }
  if (sp === SP.BOMBE) { // papillotes du papier d'emballage
    const P = COUL[t];
    for (const s of [-1, 1]) {
      g.save(); g.scale(s, 1);
      g.beginPath(); g.moveTo(r * 0.7, 0); g.lineTo(r * 1.22, -r * 0.55); g.quadraticCurveTo(r * 1.05, 0, r * 1.22, r * 0.55); g.closePath();
      g.fillStyle = P.l; g.fill(); g.lineWidth = r * 0.06; g.strokeStyle = P.d; g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = r * 0.05;
      g.beginPath(); g.moveTo(r * 0.85, -r * 0.18); g.lineTo(r * 1.12, -r * 0.4); g.moveTo(r * 0.85, r * 0.18); g.lineTo(r * 1.12, r * 0.4); g.stroke();
      g.restore();
    }
    g.scale(0.86, 0.86);

// ---------- dessin ----------

  const liste = [...P.sprites.values()].sort((a, b) => (a.tw ? 1 : 0) - (b.tw ? 1 : 0));
  for (const s of liste) {
    let sc = 1, sxx = 1, syy = 1, a = 1, rot = 0;
    if (s.mort) {
      const k = Math.min(1, s.mort.t / s.mort.d);
      if (s.mort.vers) { s.x = lerp(s.mort.x0, s.mort.vers.c, ease.inOut(k)); s.y = lerp(s.mort.y0, s.mort.vers.r, ease.inOut(k)); sc = 1 - k * 0.6; a = 1 - k * 0.8; }

    if (P.sel && !P.occupé && p.g[P.sel.r][P.sel.c] && p.g[P.sel.r][P.sel.c].id === s.id) sc *= 1 + Math.sin(P.temps * 7) * 0.05;
    // respiration très légère des bonbons spéciaux
    if (s.sp) sc *= 1 + Math.sin(P.temps * 4 + s.id) * 0.035;
    const X = px(s.x), Y = py(s.y) + (1 - syy) * cs * 0.4;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(X, Y); if (rot) ctx.rotate(rot); ctx.scale(sc * sxx, sc * syy);
    if (s.sp === SP.ARC) { ctx.rotate(Math.sin(P.temps * 1.5 + s.id) * 0.08); }
    const im = imgBonbon(s.t, s.sp);
    ctx.drawImage(im, -cs / 2, -cs / 2, cs, cs);
    if (s.sp && s.sp !== SP.ARC) { // petit éclat qui tourne

    ctx.lineJoin = 'round'; ctx.lineWidth = (q.taille || 22) * 0.28; ctx.strokeStyle = q.bord || '#c2457e'; ctx.strokeText(q.txt, 0, 0);

}

}

function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

function dire(txt, d) { if (!partie) return; partie.mochi.bulle = txt; partie.mochi.bulleT = d || 2; }

// ---------- effets ----------
function particules(X, Y, couleur, n, force) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (120 + Math.random() * 220) * (force || 1);
    partie.parts.push({ x: X, y: Y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, d: 0.5 + Math.random() * 0.4, s: 3 + Math.random() * 4, c: couleur, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, forme: Math.random() < 0.25 ? 'etoile' : 'bout' });
  }
}
function texte(txt, x, y, opts) { partie.textes.push(Object.assign({ txt, x, y, t: 0, d: 0.9 }, opts || {})); }

// ---------- lecture des étapes du moteur ----------
const MOTS = ['', '', 'Doux !', 'Délicieux !', 'Divin !', 'Sucrissime !', 'Pâtissier de génie !'];
async function jouerEtapes(étapes) {
  const P = partie;
  for (const é of étapes) {
    if (P !== partie) return;
    if (é.k === 'echange') {
      const a = P.sprites.get(é.ida), b = P.sprites.get(é.idb);
      tween(a, é.b.c, é.b.r, 0.16); tween(b, é.a.c, é.a.r, 0.16);
      son('echange'); await attendre(170);
    } else if (é.k === 'efface') await jouerEfface(é);
    else if (é.k === 'chute') { jouerChute(é); await attendreRepos(); }
    else if (é.k === 'sortie') {
      for (const it of é.items) {
        const s = P.sprites.get(it.id); if (!s) continue;
        s.mort = { t: 0, d: 0.5, x0: s.x, y0: s.y, vers: { c: s.x, r: s.y + 1.2 } };
        volerVersObjectif('cerise', px(it.c), py(it.r), spriteBonbon(9, 0, 64));
        particules(px(it.c), py(it.r) + L.cs * 0.5, '#ff7fa3', 14); texte('+500', px(it.c), py(it.r), { taille: 22 });
      }
      son('cerise'); vibrer(); humeur('joie'); dire('Une cerise de plus !', 1.6);
      await attendre(420);
    } else if (é.k === 'transforme') {
      for (const it of é.items) { const s = P.sprites.get(it.id); if (s) { s.sp = it.sp; s.pop = 1; particules(px(s.x), py(s.y), '#fff', 5, 0.6); } }
      son('special'); await attendre(é.bonus ? 380 : 300);
    } else if (é.k === 'melange') {
      texte('Mélange !', W / 2, py((P.p.R - 1) / 2), { taille: 40, gros: 1, d: 1.2, monte: 10 });
      son('melange');
      for (const m of é.moves) { const s = P.sprites.get(m.id); if (s) { s.t = m.t; tween(s, m.c, m.r, 0.5, ease.inOut); } }
      await attendre(560);

  }
}
function tween(s, c, r, d, e) { if (!s) return; s.tw = { x0: s.x, y0: s.y, x1: c, y1: r, t: 0, d, e }; s.tx = c; s.ty = r; }

async function jouerEfface(é) {
  const P = partie, cs = L.cs;
  // effets des objets spéciaux
  let delaiMax = 0;
  const centres = é.fx.map(f => ({ r: f.r, c: f.c }));
  for (const f of é.fx) {
    P.fx.push(Object.assign({ t: 0, d: f.type === 'ligne' ? 0.45 : f.type === 'bombe' ? 0.5 : 0.7 }, f));
    if (f.type === 'ligne') { son('ligne'); P.secousse = Math.max(P.secousse, 0.4); }
    else if (f.type === 'bombe') { son('bombe'); P.secousse = Math.max(P.secousse, 0.9); vibrer('fort'); }
    else { son('arc'); P.secousse = Math.max(P.secousse, 0.7); vibrer('fort'); }
  }
  if (é.fx.length) { humeur('surpris', 1); }
  const groupes = new Map();
  for (const cr of é.créés) for (const [r, c] of (cr.cells || [])) groupes.set(r * 64 + c, cr);
  const coulObj = new Set(P.niv.goals.filter(g => g.type === 'couleur').map(g => g.t));
  let volés = 0;
  for (const x of é.retirés) {
    const s = P.sprites.get(x.id); if (!s) continue;
    let retard = 0;
    if (centres.length) { let dm = 99; for (const ce of centres) dm = Math.min(dm, Math.hypot(ce.r - x.r, ce.c - x.c)); retard = Math.min(0.35, dm * 0.04); }
    delaiMax = Math.max(delaiMax, retard);
    const cr = groupes.get(x.r * 64 + x.c);
    if (cr && !x.fusion) s.mort = { t: -retard, d: 0.2, x0: s.x, y0: s.y, vers: { c: cr.c, r: cr.r } };
    else s.mort = { t: -retard, d: 0.26 };
    const col = x.t < 6 ? COUL[x.t].b : '#fff';
    setTimeout(() => { if (P === partie) particules(px(x.c), py(x.r), col, x.fusion ? 4 : 7); }, retard * 1000);
    if (coulObj.has(x.t) && volés < 6) { volés++; volerVersObjectif('t' + x.t, px(x.c), py(x.r), imgBonbon(x.t, 0)); }
  }
  // crème, glaçage, rubans
  setTimeout(() => {
    if (P !== partie) return;
    for (const q of é.creme) { P.vue.creme[q.r][q.c] = q.v; particules(px(q.c), py(q.r), q.v ? '#ffd99a' : '#fff1c4', 5, 0.7); if (q.v === 0 && volés++ < 10) volerVersObjectif('creme', px(q.c), py(q.r), spriteCreme(2, 64)); }
    for (const q of é.glace) {
      P.vue.glace[q.r][q.c] = q.v; P.vue.fissure[q.r][q.c] = 1;
      for (let i = 0; i < 8; i++) { const a = Math.random() * 6.28; P.parts.push({ x: px(q.c), y: py(q.r), vx: Math.cos(a) * 200, vy: Math.sin(a) * 200 - 150, t: 0, d: 0.6, s: 5, c: q.v ? '#ffd6e7' : '#eaf4ff', rot: a, vr: 8, forme: 'eclat' }); }
      if (q.v === 0) volerVersObjectif('glace', px(q.c), py(q.r), spriteGlacage(2, 64));
    }
    for (const q of é.verrous) { const s = P.sprites.get(q.id); if (s) { s.verrou = 0; s.pop = 1; } particules(px(q.c), py(q.r), '#ff8fbd', 8); }
    if (é.creme.length) son('creme'); if (é.glace.length) son('glace'); if (é.verrous.length) son('verrou');
  }, delaiMax * 600);
  son('pop', é.chaîne);
  if (é.retirés.length) vibrer();
  // nouveaux bonbons spéciaux
  setTimeout(() => {
    if (P !== partie) return;
    for (const cr of é.créés) {
      const s = ajouterSprite({ id: cr.id, t: cr.t, sp: cr.sp }, cr.r, cr.c); s.apparait = 0;
      particules(px(cr.c), py(cr.r), '#fff', 10, 0.8);
    }
    if (é.créés.length) { son('special'); humeur('joie', 1.2); dire(['Waouh !', 'Joli !', 'Trop beau !', 'Miam !'][Math.floor(Math.random() * 4)], 1.3); }
  }, 150);
  if (é.centre && é.gain) texte('+' + é.gain, px(é.centre.c), py(é.centre.r), { taille: 18 + Math.min(10, é.chaîne * 3), bord: '#b2508a' });
  if (é.chaîne >= 2 && MOTS[Math.min(é.chaîne, 6)]) {
    const mot = MOTS[Math.min(é.chaîne, 6)];
    setTimeout(() => { if (P === partie) { texte(mot, W / 2, L.oy + L.cs * P.p.R * 0.42, { taille: 40, gros: 1, d: 1.1, monte: 20, c: '#fff', bord: '#d0558d' }); son('mot'); humeur('joie', 1.5); } }, 120);
  }
  await attendre(Math.max(240, delaiMax * 1000 + 260));
}

function jouerChute(é) {
  const P = partie;
  for (const m of é.moves) {
    const s = P.sprites.get(m.id); if (!s) continue;
    if (m.c !== Math.round(s.x)) tween(s, m.c, m.r, 0.12 + 0.06 * Math.abs(m.r - s.y), ease.inOut);
    else { s.tx = m.c; s.ty = m.r; s.vy = 0; s.attente = 0; }
  }
  for (const n of é.spawns) {
    const haut = L.hautCol[n.c] < 0 ? 0 : L.hautCol[n.c];
    const s = ajouterSprite({ id: n.id, t: n.t, sp: n.sp }, n.r, n.c, n.surPlace ? n.r : haut - n.n);
    s.ty = n.r; s.attente = 0;
    if (n.surPlace) s.apparait = 0;
  }
}

function volerVersObjectif(clef, x, y, img) {
  const P = partie; if (!P.posObj) return;
  const cible = P.posObj.find(q => (q.o.type === 'couleur' ? 't' + q.o.t : q.o.type) === clef); if (!cible) return;
  P.volants.push({ x0: x, y0: y, x1: cible.x, y1: cible.y, t: 0, d: 0.55 + Math.random() * 0.2, img, s0: L.cs * 0.8 });
}

// ---------- contrôles ----------
let appui = null;
function cellule(x, y) {
  const c = Math.floor((x - L.ox) / L.cs), r = Math.floor((y - L.oy) / L.cs);
  if (r < 0 || c < 0 || r >= partie.p.R || c >= partie.p.C || !partie.p.ok[r][c]) return null;
  return { r, c };
}
cv.addEventListener('pointerdown', e => {
  if (!partie || !actif) return;
  SON.init();
  const P = partie, b = P.boutonPause;
  if (b && Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r) { son('clic'); ouvrirPause(); return; }
  if (P.occupé || P.fini) return;
  const q = cellule(e.clientX, e.clientY); if (!q) { P.sel = null; return; }
  appui = { x: e.clientX, y: e.clientY, q, glissé: false };
  try { cv.setPointerCapture(e.pointerId); } catch (er) { }
});
cv.addEventListener('pointermove', e => {
  if (!appui || appui.glissé || !partie || partie.occupé) return;
  const dx = e.clientX - appui.x, dy = e.clientY - appui.y;
  if (Math.hypot(dx, dy) > L.cs * 0.32) {
    appui.glissé = true;
    const b = Math.abs(dx) > Math.abs(dy) ? { r: appui.q.r, c: appui.q.c + Math.sign(dx) } : { r: appui.q.r + Math.sign(dy), c: appui.q.c };
    partie.sel = null; essayer(appui.q, b);
  }
});
cv.addEventListener('pointerup', () => {
  if (!appui || !partie) { appui = null; return; }
  if (!appui.glissé) {
    const P = partie, q = appui.q;
    if (P.sel && Math.abs(P.sel.r - q.r) + Math.abs(P.sel.c - q.c) === 1) { const a = P.sel; P.sel = null; essayer(a, q); }
    else if (P.sel && P.sel.r === q.r && P.sel.c === q.c) P.sel = null;
    else { P.sel = q; son('clic'); }
  }
  appui = null;
});
cv.addEventListener('pointercancel', () => { appui = null; });

async function essayer(a, b) {
  const P = partie, p = P.p;
  if (P.occupé || b.r < 0 || b.c < 0 || b.r >= p.R || b.c >= p.C || !p.ok[b.r][b.c]) return;
  P.inactif = 0; P.indice = null;
  const étapes = p.jouer(a, b);
  if (!étapes) {
    const xa = p.g[a.r][a.c], xb = p.g[b.r][b.c];
    if (xa && xb && !p.glace[a.r][a.c] && !p.glace[b.r][b.c]) {
      const sa = P.sprites.get(xa.id), sb = P.sprites.get(xb.id);
      if (sa) sa.tw = { x0: a.c, y0: a.r, x1: b.c, y1: b.r, t: 0, d: 0.3, retour: 1 };
      if (sb) sb.tw = { x0: b.c, y0: b.r, x1: a.c, y1: a.r, t: 0, d: 0.3, retour: 1 };
    }
    son('refus'); vibrer();
    if (Math.random() < 0.3) dire('Ça ne fait rien…', 1.2);
    return;
  }
  P.occupé = true;
  await jouerEtapes(étapes);
  if (P !== partie) return;
  P.occupé = false; P.inactif = 0;
  verifierFin();
}

async function verifierFin() {
  const P = partie, p = P.p;
  if (P.fini) return;
  if (p.gagne()) {
    P.fini = true; P.occupé = true;
    texte('Bravo !', W / 2, L.oy + L.cs * p.R * 0.45, { taille: 54, gros: 1, d: 1.4, monte: 10, bord: '#d0558d' });
    son('gagne'); humeur('joie', 4); dire('Trop fort !', 2);
    await attendre(1100);
    if (p.coups > 0) {
      texte('Pluie de sucre !', W / 2, L.oy + L.cs * p.R * 0.45, { taille: 40, gros: 1, d: 1.2, monte: 10, bord: '#8566dd' });
      await attendre(500);
      await jouerEtapes(p.bonusFin());
      await attendre(400);
    }
    if (P !== partie) return;
    finNiveau(true);
  } else if (p.coups <= 0) {
    P.fini = true; P.occupé = true;
    await attendre(500);
    if (P !== partie) return;
    finNiveau(false);
  } else if (p.coups === 5) dire('Plus que 5 coups !', 1.6);
}
function plusCinq() {
  const P = partie; P.p.coups += 5; P.fini = false; P.occupé = false; P.aideUtilisee = true;
  texte('+5 coups', W / 2, L.oy + L.cs * P.p.R * 0.45, { taille: 40, gros: 1, d: 1.1, monte: 10 });
  dire('Allez, on y croit !', 1.8);
}

}
function ouvrirReglages() {
  fenetre(`<div class="ruban lav">Réglages</div><img class="mochi-pop" src="${iconeURL('mochi-joie', 180)}" alt="">${reglagesHTML()}
    <div class="boutons" style="margin-top:14px"><button class="btn vert" id="p-ok">OK</button></div>
    <div class="credits">Sucre Pastel · fait avec amour et beaucoup de sucre</div>`, fermerFenetre);
  brancherReglages(); $('p-ok').onclick = () => { son('clic'); fermerFenetre(); };
}

function finNiveau(gagne) {
  const P = partie, i = P.i, p = P.p;
  if (gagne) {
    const n = Math.max(1, p.etoiles()), avant = etoiles[i];
    if (n > avant) { etoiles[i] = n; SAUVE.ecrire('etoiles', etoiles); }
    const rec = p.score > (records[i] || 0); if (rec) { records[i] = p.score; SAUVE.ecrire('records', records); }
    const dernier = i === NB_NIVEAUX - 1;
    fenetre(`<div class="ruban vert">${['', 'Réussi !', 'Super !', 'Parfait !'][n]}</div>
      <div class="grandes-etoiles">${[0, 1, 2].map(k => `<img src="${iconeURL('score', 140)}" data-k="${k}" alt="">`).join('')}</div>
      <div class="score-fin">${fmt(p.score)}</div><div class="record">${rec && avant ? 'Nouveau record !' : ''}</div>
      ${dernier ? '<div class="nouveau">Tu as terminé les 120 niveaux. Bravo, grand chef pâtissier !</div>' : ''}
      <div class="boutons" style="margin-top:10px">
        ${dernier ? '' : '<button class="btn vert" id="p-suiv" style="font-size:26px;padding:12px 46px 14px">Suivant</button>'}
        <div class="ligne-btn"><button class="btn petit" id="p-rej">Rejouer</button><button class="btn petit lav" id="p-carte">Carte</button></div>
      </div>`, null);
    $('pop').querySelectorAll('.grandes-etoiles img').forEach((im, k) => { if (k < n) setTimeout(() => { im.classList.add('on'); son('etoile', k); vibrer(); }, 350 + k * 380); });
    if ($('p-suiv')) $('p-suiv').onclick = () => { son('clic'); fermerFenetre(); partie = null; ouvrirCarte(i + 1); ouvrirIntro(i + 1); };
  } else {
    son('perdu');
    const reste = p.objectifs().filter(o => o.fait < o.total);
    const peut = !P.aideUtilisee;
    fenetre(`<div class="ruban lav">Presque !</div>
      <img class="mochi-pop" src="${iconeURL('mochi-surpris', 180)}" alt="">
      <div class="objs">${reste.map(o => `<div class="obj"><img src="${iconeURL(o.type === 'couleur' ? 't' + o.t : o.type, 88)}" alt="">${manque(o)}</div>`).join('')}</div>
      <div class="boutons">
        ${peut ? '<button class="btn vert" id="p-plus">+5 coups</button>' : ''}
        <div class="ligne-btn"><button class="btn petit" id="p-rej">Réessayer</button><button class="btn petit lav" id="p-carte">Carte</button></div>
      </div>`, null);
    if ($('p-plus')) $('p-plus').onclick = () => { son('clic'); fermerFenetre(); plusCinq(); };
  }
  $('p-rej').onclick = () => { son('clic'); fermerFenetre(); lancerNiveau(i); };
  $('p-carte').onclick = () => { son('clic'); fermerFenetre(); partie = null; ouvrirCarte(i); };
}

// ----- bouton retour Android, mise en veille -----
function retour() {
  if (popOuverte) { if (popOuverte.fermable) popOuverte.fermable(); return true; }
  if (ecranActuel === 'jeu') { ouvrirPause(); return true; }
  if (ecranActuel === 'carte') { montrer('titre'); return true; }
  return false;
}
const AppNative = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (AppNative) AppNative.addListener('backButton', () => { if (!retour()) AppNative.exitApp(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { SON.pause(true); if (ecranActuel === 'jeu' && partie && !popOuverte && !partie.fini) ouvrirPause(); }
  else SON.pause(false);
});

// ----- démarrage -----
function demarrer() { redim(); preparerTitre(); montrer('titre'); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(demarrer);

</script>
